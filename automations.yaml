  - alias: AI TTS Announcement
    action: notify.alexa_media
    data:
      target: media_player.all_echos
      message: "{{ visitor_analysis.choices[0].message.content | default(\"Someone
        is at the front door.\", true)\n   if visitor_analysis is defined and visitor_analysis.choices
        is defined and visitor_analysis.choices | length > 0\n   else \"Someone is
        at the front door.\" }}"
      data:
        type: tts
  - delay:
