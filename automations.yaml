    - conditions:
      - condition: trigger
        id: trash_cleared
      - condition: state
        entity_id: input_boolean.trash_reminder
        state: 'on'
      sequence:
      - action: conversation.process
        continue_on_error: true
        data:
          agent_id: conversation.extended_openai_conversation_2
          text: >-
            Rewrite this in a creative, witty, or humorous way (limit to about 35 words, no quotes):
