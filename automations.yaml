- id: '1772286703556'
  alias: 'Door Security: Entry Chimes (Throttled)'
  description: Plays siren tone when a door opens with a 30-second cooldown per door.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.garage_man_door
    - binary_sensor.front_door
    - binary_sensor.bedroom_door
    - binary_sensor.catio_door
    from:
    - 'off'
    to:
    - 'on'
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: alarm_control_panel.home_alarm
      state: armed_night
  - condition: template
    value_template: '{%- set raw = states(''input_text.door_announce_cooldown'') -%}
      {%- set repo = raw | from_json(default={}) if raw not in ['''', ''unknown'',
      ''unavailable'', None] else {} -%} {%- set last_ts = repo.get(trigger.entity_id,
      0) | float(0) -%} {{ (as_timestamp(now()) - last_ts) >= 30 }}'
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.door_announce_cooldown
    data:
