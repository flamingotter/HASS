        {%- set repo = raw | from_json(default={}) if raw not in ['', 'unknown', 'unavailable', None] else {} -%}
        {{ repo | combine({trigger.entity_id: as_timestamp(now()) | int}) | to_json }}
  - action: siren.turn_on
