- id: climate_bedroom_target_override_safeguard
  alias: 'Climate: Bedroom Target Override Safeguard'
  description: Detects manual changes to bedroom target temperature during active
    pre-cooling and offers a mobile alert with a one-tap action to revert.
  triggers:
  - trigger: state
    entity_id: input_number.bedroom_target_temperature
    id: target_changed
  - trigger: event
    event_type: mobile_app_notification_action
    id: notification_action
  conditions: []
  actions:
  - choose:
    - alias: Target changed during pre-cooling
      conditions:
      - condition: template
        value_template: '{{ trigger.id == ''target_changed'' }}'
      - condition: template
        value_template: '{{ trigger.to_state.context.user_id is not none }}'
      - condition: template
        value_template: '{{ trigger.from_state is not none and trigger.from_state.state
          not in [''unknown'', ''unavailable''] }}'
      - condition: template
        value_template: "{% set b = states('input_datetime.bedroom_bedtime') %} {%
          set bedtime_str = b if b not in ['unknown', 'unavailable', 'None'] else
          '22:30:00' %} {% set bedtime = today_at(bedtime_str) %} {% set target =
          trigger.from_state.state | float(68) %} {% set t6_temp = state_attr('climate.t6_pro_downstairs',
          'current_temperature') | float(72) %} {% set bdr_raw = states('sensor.bedroom_temperature_smoothed')
          | float(t6_temp) %} {% set indoor = [bdr_raw, t6_temp + 3.0]|min %} {% set
          outdoor = states('sensor.weather_station_temperature_outdoor') | float(70)
          %} {%- set raw = states('input_text.mbr_cooling_performance_data') | from_json
          -%} {%- set lkey = ((outdoor / 5) | round(0) | int * 5) | string | trim
          -%} {%- set ns = namespace(orate=25) -%} {%- for k, v in raw.items() -%}\n
          \ {%- if k|string|trim == lkey -%}\n    {%- set ns.orate = v | float -%}\n
          \ {%- endif -%}\n{%- endfor -%} {%- set base_rate = ns.orate -%} {% set
          delta = [0, indoor - target]|max %} {% set lead_min = (delta * base_rate)
          %} {% set start_ts = as_timestamp(bedtime, 0) - (lead_min * 60) %} {% set
          is_sleep_window = now() >= bedtime or now().hour < 7 %} {% set is_precool_window
          = as_timestamp(now(), 0) >= start_ts and now() < bedtime %} {% set is_cooling_mode
          = is_state('climate.t6_pro_downstairs', 'cool') %} {{ is_precool_window
          and not is_sleep_window and indoor > target and is_cooling_mode }}"
      sequence:
      - action: notify.mobile_app_josh_mobile
        data:
          title: Bedroom Target Override Detected
          message: The bedroom target was changed from {{ trigger.from_state.state
            | float | int }}°F to {{ trigger.to_state.state | float | int }}°F during
            pre-cooling. Tap below to revert.
          data:
            tag: bedroom_target_override
            ttl: 0
            priority: high
            actions:
            - action: REVERT_BEDROOM_TARGET_{{ trigger.from_state.state | float |
                int }}
              title: Revert to {{ trigger.from_state.state | float | int }}°F
            - action: KEEP_BEDROOM_TARGET
              title: Keep {{ trigger.to_state.state | float | int }}°F
    - alias: Notification action triggered
      conditions:
      - condition: template
        value_template: '{{ trigger.id == ''notification_action'' }}'
      - condition: template
        value_template: '{{ trigger.event.data.action.startswith(''REVERT_BEDROOM_TARGET_'')
          }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.bedroom_target_temperature
        data:
          value: '{{ trigger.event.data.action.replace(''REVERT_BEDROOM_TARGET_'',
            '''') | float }}'
      - action: notify.mobile_app_josh_mobile
        data:
          message: clear_notification
          data:
            tag: bedroom_target_override
    - alias: Keep target
      conditions:
      - condition: template
        value_template: '{{ trigger.id == ''notification_action'' }}'
      - condition: template
        value_template: '{{ trigger.event.data.action == ''KEEP_BEDROOM_TARGET'' }}'
      sequence:
      - action: notify.mobile_app_josh_mobile
        data:
          message: clear_notification
          data:
            tag: bedroom_target_override
  mode: single
- id: light_control_catio_zen73
  alias: 'Light Control: Catio (v2.0)'
  description: Synchronizes Zooz ZEN73 Catio switches (switch.catio_light_01, switch.catio_light_02,
    switch.catio_light_03) in Smart Bulb Mode with LIFX lights (light.catio_lifx_01,
    light.catio_lifx_02) supporting 100% 4500K on single-tap up, 20% colorloop on
    double-tap up, 4500K effect-stop on double-tap down, and off on single-tap down.
  triggers:
  - id: top
    trigger: event
    event_type: zwave_js_value_notification
    event_data:
      property_key: '001'
  - id: bottom
    trigger: event
    event_type: zwave_js_value_notification
    event_data:
      property_key: '002'
  - id: light_state_on
    trigger: state
    entity_id:
    - light.catio_lifx_01
    - light.catio_lifx_02
    to: 'on'
  - id: light_state_off
    trigger: state
    entity_id:
    - light.catio_lifx_01
    - light.catio_lifx_02
    to: 'off'
  conditions:
  - condition: template
    value_template: "{{ trigger.id in ['light_state_on', 'light_state_off'] or\n   trigger.event.data.device_id
      in [\n     device_id('switch.catio_light_01'),\n     device_id('switch.catio_light_02'),\n
      \    device_id('switch.catio_light_03')\n   ] }}"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''top'' and trigger.event.data.value ==
          ''KeyPressed2x'' }}'
      sequence:
      - action: lifx.effect_colorloop
        continue_on_error: true
        target:
          entity_id:
          - light.catio_lifx_01
          - light.catio_lifx_02
        data:
          brightness_pct: 20
          transition: 2
      - action: switch.turn_on
        target:
          entity_id:
          - switch.catio_light_01
          - switch.catio_light_02
          - switch.catio_light_03
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''top'' and trigger.event.data.value ==
          ''KeyPressed'' }}'
      sequence:
      - action: lifx.effect_stop
        continue_on_error: true
        target:
          entity_id:
          - light.catio_lifx_01
          - light.catio_lifx_02
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id:
          - light.catio_lifx_01
          - light.catio_lifx_02
        data:
          color_temp_kelvin: 4500
          brightness_pct: 100
          transition: 2
      - action: switch.turn_on
        target:
          entity_id:
          - switch.catio_light_01
          - switch.catio_light_02
          - switch.catio_light_03
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''bottom'' and trigger.event.data.value
          == ''KeyPressed2x'' }}'
      sequence:
      - action: lifx.effect_stop
        continue_on_error: true
        target:
          entity_id:
          - light.catio_lifx_01
          - light.catio_lifx_02
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id:
          - light.catio_lifx_01
          - light.catio_lifx_02
        data:
          color_temp_kelvin: 4500
          transition: 2
      - action: switch.turn_on
        target:
          entity_id:
          - switch.catio_light_01
          - switch.catio_light_02
          - switch.catio_light_03
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''bottom'' and trigger.event.data.value
          == ''KeyPressed'' }}'
      sequence:
      - action: lifx.effect_stop
        continue_on_error: true
        target:
          entity_id:
          - light.catio_lifx_01
          - light.catio_lifx_02
      - action: light.turn_off
        continue_on_error: true
        target:
          entity_id:
          - light.catio_lifx_01
          - light.catio_lifx_02
        data:
          transition: 2
      - action: switch.turn_off
        target:
          entity_id:
          - switch.catio_light_01
          - switch.catio_light_02
          - switch.catio_light_03
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''light_state_on'' }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.catio_light_01
          - switch.catio_light_02
          - switch.catio_light_03
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''light_state_off'' }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.catio_light_01
          - switch.catio_light_02
          - switch.catio_light_03
  mode: restart
- id: light_control_garage_entry_zen73_zen12
  alias: 'Light Control: Garage Entry (v2.0)'
  description: Synchronizes Zooz ZEN73 switch (switch.garage_entry_switch) and ZEN12
    motion switch (light.garage_motion_switch) with motion occupancy and auto-off.
  triggers:
  - id: top
    trigger: event
    event_type: zwave_js_value_notification
    event_data:
      property_key: '001'
  - id: bottom
    trigger: event
    event_type: zwave_js_value_notification
    event_data:
      property_key: '002'
  - id: motion_on
    trigger: state
    entity_id: binary_sensor.motion_indoors_garage_motion_switch_motion_detection
    to: 'on'
  - id: motion_off
    trigger: state
    entity_id: binary_sensor.motion_indoors_garage_motion_switch_motion_detection
    to: 'off'
    for:
      minutes: 10
  - id: switch_state_on
    trigger: state
    entity_id:
    - switch.garage_entry_switch
    - light.garage_motion_switch
    to: 'on'
  - id: switch_state_off
    trigger: state
    entity_id:
    - switch.garage_entry_switch
    - light.garage_motion_switch
    to: 'off'
  conditions:
  - condition: template
    value_template: "{{ trigger.id in ['motion_on', 'motion_off', 'switch_state_on',
      'switch_state_off'] or\n   trigger.event.data.device_id in [\n     device_id('switch.garage_entry_switch'),\n
      \    device_id('light.garage_motion_switch')\n   ] }}"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.id in ['motion_on', 'switch_state_on'] or\n   (trigger.id
          == 'top' and trigger.event.data.value in ['KeyPressed', 'KeyPressed2x'])
          }}"
      sequence:
      - variables:
          targets: '{{ [''switch.garage_entry_switch'', ''light.garage_motion_switch'']
            | reject(''is_state'', ''on'') | list }}'
      - if:
        - condition: template
          value_template: '{{ targets | length > 0 }}'
        then:
        - action: homeassistant.turn_on
          target:
            entity_id: '{{ targets }}'
    - conditions:
      - condition: template
        value_template: "{{ trigger.id in ['motion_off', 'switch_state_off'] or\n
          \  (trigger.id == 'bottom' and trigger.event.data.value in ['KeyPressed',
          'KeyPressed2x']) }}"
      sequence:
      - variables:
          targets: '{{ [''switch.garage_entry_switch'', ''light.garage_motion_switch'']
            | reject(''is_state'', ''off'') | list }}'
      - if:
        - condition: template
          value_template: '{{ targets | length > 0 }}'
        then:
        - action: homeassistant.turn_off
          target:
            entity_id: '{{ targets }}'
  mode: restart
