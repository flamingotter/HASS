            state: below_horizon
          then:
          - action: switch.turn_on
            target:
              entity_id: switch.garage_spot_light
        - action: timer.start
          data:
            duration: 00:05:00
          target:
            entity_id: timer.timer_garage_spotlight
    - conditions:
      - condition: trigger
        id:
        - 0800
      sequence:
      - action: media_player.volume_set
        data:
          volume_level: 0.3
        target:
          entity_id:
          - media_player.babe_cave
          - media_player.counter
          - media_player.dining_room
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: input_select.josh_status
            state:
            - Away
            - Extended Away
        then:
        - action: button.press
          metadata: {}
          target:
            entity_id: button.office_wake_on_lan_pc
          data: {}
    - conditions:
      - condition: trigger
        id:
        - Spotlight Timer Complete
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.garage_spot_light
    - conditions:
      - condition: trigger
        id:
        - garage_door_locked
      - condition: state
        entity_id: input_select.josh_status
        state:
        - Away
        - Extended Away
      - condition: state
        entity_id: input_select.mj_status
        state:
        - Away
        - Extended Away
      - condition: state
        entity_id: alarm_control_panel.home_alarm
        state: disarmed
      sequence:
      - variables:
          had_guests: "{{ is_state('input_boolean.house_guests', 'on') }}"
      - if:
        - condition: state
          entity_id: input_select.josh_status
          state: Extended Away
        - condition: state
          entity_id: input_select.mj_status
          state: Extended Away
        then:
        - action: alarm_control_panel.alarm_arm_vacation
          target:
            entity_id: alarm_control_panel.home_alarm
        else:
        - action: alarm_control_panel.alarm_arm_away
          target:
            entity_id: alarm_control_panel.home_alarm
      - if:
