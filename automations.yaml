    - conditions:
      - condition: trigger
        id:
        - armed away
      sequence:
      - parallel:
        - if:
          - condition: template
            value_template: "{%- set locks = state_attr('lock.door_locks', 'entity_id')
              -%} {%- if locks -%}\n  {{- locks | select('is_state', 'unlocked') |
              list | length > 0 -}}\n{%- else -%}\n  false\n{%- endif -%}"
          then:
          - action: lock.lock
            continue_on_error: true
            target:
              entity_id: '{%- set locks = state_attr(''lock.door_locks'', ''entity_id'')
                -%} {{- locks | select(''is_state'', ''unlocked'') | list -}}'
        - action: light.turn_off
