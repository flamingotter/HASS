        Away', 'Work']\n   and states('input_select.mj_status') in ['Away', 'Extended
        Away', 'Work']\n   and is_state('input_boolean.house_guests', 'on')\n   and
        states('alarm_control_panel.home_alarm') == 'disarmed' }}"
    then:
    - action: script.activate_mobile_actionable_notification
      data:
        notify_target: notify.all_devices
