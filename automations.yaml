      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.dining
          - light.dining_switch_01
          - light.dining_switch_02
        data:
          brightness_pct: 100
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.value == ''KeyPressed'' and trigger.id
          == ''bottom'' }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.dining
          - light.dining_switch_01
          - light.dining_switch_02
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.value == ''KeyHeldDown'' and trigger.id
