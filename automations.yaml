    to: 'off'
  actions:
  - condition: template
    value_template: "{{ trigger.id in ['light_state_on', 'light_state_off'] or\n   trigger.event.data.device_id
      in [\n     'c125586b93f269297aa55b3247f9d054',\n     '961b9d5943f96a6021fbf5392265d48c'\n
      \  ] }}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''light_state_on'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.dining_switch_01
          - light.dining_switch_02
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''light_state_off'' }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.dining_switch_01
          - light.dining_switch_02
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.value == ''KeyPressed2x'' and trigger.id
          == ''top'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.dining
          - light.dining_switch_01
          - light.dining_switch_02
        data:
          brightness_pct: 100
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.value == ''KeyPressed2x'' and trigger.id
          == ''bottom'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.dining
          - light.dining_switch_01
          - light.dining_switch_02
        data:
          brightness_pct: 50
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.value == ''KeyPressed'' and trigger.id
          == ''top'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.dining
          - light.dining_switch_01
          - light.dining_switch_02
        data:
          brightness_pct: 100
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.value == ''KeyPressed'' and trigger.id
          == ''bottom'' }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.dining
          - light.dining_switch_01
          - light.dining_switch_02
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.value == ''KeyHeldDown'' and trigger.id
          == ''top'' }}'
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ true }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.dining
            data:
              brightness_step_pct: 10
          - delay: '00:00:00.3'
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.value == ''KeyHeldDown'' and trigger.id
          == ''bottom'' }}'
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ true }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.dining
            data:
              brightness_step_pct: -10
          - delay: '00:00:00.3'
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.value == ''KeyReleased'' }}'
      sequence:
      - stop: Button released
  mode: restart
- id: '1772286703556'
  alias: 'Door Security: Entry Chimes (Throttled)'
