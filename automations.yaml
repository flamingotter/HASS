  max: 10
- id: '1772728212323'
  alias: 'Security: Front Porch - AI Video Analysis (v1.7)'
  description: 'v1.7: Dual-camera AI coverage (doorbell snapshot + walkway approach video)
    with 3-minute visitor event cooldown against notify.daily_camera_log to prevent duplicate arrival/departure reporting.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.front_porch_ptz_person_detected
    to: 'on'
  - trigger: state
    entity_id: input_button.test_porch_ai
  conditions:
  - condition: state
    entity_id: input_boolean.camera_alerts
    state: 'on'
  - condition: template
    value_template: "{{ (trigger is defined and trigger.entity_id == 'input_button.test_porch_ai')
      or\n   (as_timestamp(now()) - as_timestamp(states('notify.daily_camera_log'),
      0) > 180) }}"
  - condition: template
    value_template: '{# Increase cooldown to 10 minutes (600s) to save quota #} {{
      this.attributes.last_triggered == None or (now() - this.attributes.last_triggered).total_seconds()
      > 600 }}

      '
    enabled: false
  actions:
  - alias: 'Data Collection: Video and Snapshots'
    continue_on_error: true
    parallel:
    - action: camera.record
      continue_on_error: true
      target:
        entity_id: camera.front_ptz_medium_resolution_channel
      data:
        duration: 12
        lookback: 3
        filename: /media/snapshots/porch/approach.mp4
    - sequence:
      - delay:
          seconds: 1
      - action: camera.snapshot
        target:
          entity_id: camera.doorbell_outside_medium_resolution_channel
        data:
          filename: /media/snapshots/porch/doorbell_t0.jpg
      - delay:
          seconds: 2
      - action: camera.snapshot
        target:
          entity_id: camera.doorbell_outside_medium_resolution_channel
        data:
          filename: /media/snapshots/porch/doorbell_t1.jpg
      - delay:
          hours: 0
          minutes: 0
          seconds: 3
          milliseconds: 0
      - action: camera.snapshot
        target:
          entity_id: camera.doorbell_outside_medium_resolution_channel
        data:
          filename: /media/snapshots/porch/doorbell_t3.jpg
  - alias: Flush Delay
    delay:
      seconds: 2
  - alias: Sample Approach Video
    action: shell_command.sample_approach_video
    continue_on_error: true
  - alias: AI Porch Video Analysis
    action: extended_openai_conversation.query_image
    data:
      config_entry: 01M3YG3WVESNZR8QG41VKNSXHE
      model: qwen-vl-7b
      prompt: >-
        You are an intelligent security camera analyst evaluating a front porch event.
        - Item 1 is a reference photo of resident Josh (profile reference only).
        - Item 2 is a reference photo of resident MJ (profile reference only).
        - Item 3 is a photo from the front doorbell camera (doorstep area).
        - Item 4 is a video from the yard PTZ camera (walkway approach).
        Do NOT describe Item 1 or Item 2. Evaluate Item 3 and Item 4 together.

        CRITICAL VIDEO & CAMERA RULES:
        - If a person or package is visible in EITHER the doorbell photo (Item 3) OR the walkway video (Item 4), report the activity!
        - Item 4 consists of sequential frames showing motion OVER TIME. One person moving across different locations in the video is a SINGLE INDIVIDUAL, NOT multiple people. Never report multiple individuals unless two or more distinct people are visibly present together at the exact same moment.
        - Residents Josh (Item 1) and MJ (Item 2) live here. Residents often step onto the porch to retrieve, open, unpack, or carry packages into the house, or to do chores. If the person matches Josh or MJ, or is opening/retrieving packages on the porch, they are a RESIDENT, NEVER a delivery driver.
        - Delivery couriers (Amazon, UPS, FedEx, USPS) arrive from outside, wear courier uniforms/vests, drop off deliveries, and leave. Couriers NEVER open or unpack boxes on the porch.

        CLASSIFICATION STEPS (Evaluate in strict order):
        1. NO ACTIVITY: If no human and no vehicle appears in Item 3 AND Item 4:
           Output: [ALL_CLEAR] No activity on porch.

        2. RESIDENT CHECK (Highest Priority):
           Compare the person to resident reference photos (Item 1 = Josh, Item 2 = MJ).
           If they match Josh or MJ, OR if they are retrieving, picking up, opening, or unpacking packages/boxes, OR engaged in yard work, maintenance, or walking around the porch/home:
           Output: [RESIDENT] Person: Josh (or MJ). Action: [specific action, e.g. retrieving packages / opening box / yard work]. Intent: Resident.

        3. DELIVERY CHECK:
           If an unfamiliar delivery courier is dropping off a parcel at the door, placing a package down, or wearing a clearly branded courier uniform (Amazon vest, UPS brown, FedEx, USPS):
           Output: [ALERT] Person: [Amazon/UPS/FedEx/USPS delivery driver]. Action: Delivered package. Intent: Delivery.

        4. ENTERED HOME:
           If an authorized guest or visitor opens the door with a key/code or is greeted and enters:
           Output: [ENTERED] Person: [visitor description]. Action: Entered home. Intent: Visitor.

        5. UNRECOGNIZED VISITOR / STRANGER:
           If an unfamiliar visitor, solicitor, or unknown person approaches the door:
           Output: [ALERT] Person: [visitor description]. Action: [action]. Intent: Visitor.

        Format: Output must be a SINGLE line starting with [ALL_CLEAR], [RESIDENT], [ENTERED], or [ALERT]. No markdown fences.
      images:
      - url: /media/snapshots/reference/josh_thumb.jpg
      - url: /media/snapshots/reference/mj_thumb.jpg
      - url: /media/snapshots/porch/doorbell_sample.jpg
      - url: /media/snapshots/porch/approach_sample.mp4
      max_tokens: 150
    response_variable: porch_report
    continue_on_error: true
  - variables:
      report: "{{ porch_report.choices[0].message.content | default('[ALL_CLEAR] No
        person on porch.', true)\n   if porch_report is defined and porch_report.choices
        is defined and porch_report.choices | length > 0\n   else '[ALL_CLEAR] No
        person on porch.' }}"
  - alias: Archive Porch Detection Media
    action: shell_command.archive_porch_snapshots
    continue_on_error: true
    data:
      tag: >-
        {%- set tag = report.split(']')[0] | replace('[', '') if ']' in report else 'ALL_CLEAR' -%}
        {{ tag | trim }}
  - if:
    - condition: template
      value_template: '{{ ''[ALL_CLEAR]'' not in report }}'
    then:
    - action: notify.send_message
      target:
        entity_id: notify.daily_camera_log
      data:
        message: '{{ now().strftime(''%I:%M %p'') }} - Front Porch: {{ report }}'
    - action: notify.send_message
      target:
        entity_id:
        - notify.porch_history
      data:
        message: '{% set tag = report.split('']'')[0] ~ '']'' if '']'' in report else
          ''[ERROR]'' %} {% set content = report.replace(tag, '''').strip() %} "{{
          now().strftime(''%Y-%m-%d'') }}","{{ now().strftime(''%H:%M:%S'') }}","{{
          tag }}","{{ content | replace(''"'', ''""'') }}"'
    - if:
      - condition: template
        value_template: '{{ ''[ALERT]'' in report }}'
      then:
      - action: notify.persistent_notification
        data:
          title: Porch Intel (Full Report)
          message: '{% set tag = report.split('']'')[0] ~ '']'' if '']'' in report
            else ''[ALERT]'' %} {{ report.replace(tag, '''').strip() }}'
      - action: notify.mobile_app_josh_mobile
        data:
          title: Porch Intel
          message: '{% set tag = report.split('']'')[0] ~ '']'' if '']'' in report
            else ''[ALERT]'' %} {{ report.replace(tag, '''').strip() | truncate(150,
            true, ''...'') }}'
      - if:
        - condition: state
          entity_id: alarm_control_panel.home_alarm
          state:
          - armed_away
          - armed_vacation
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.porch_visitor_while_away
  mode: single
- id: '1772742848092'
  alias: System - Cameras - Evening AI Rollup
  description: Reads daily porch events and generates an evening HTML security briefing
    via Local Brain (Qwen 32B).
  triggers:
  - at: '20:00:00'
    trigger: time
  actions:
  - action: shell_command.read_daily_camera_log
    response_variable: daily_log
  - variables:
      raw_log: '{{ (daily_log.stdout | default('''', true)).strip() if daily_log is
        defined and daily_log.stdout is defined else '''' }}'
      filtered_log: >-
        {%- if raw_log | length > 0 -%}
          {{ raw_log.split('\n') | reject('search', '\[RESIDENT\]') | list | join('\n') | trim }}
        {%- else -%}
          
        {%- endif -%}
  - if:
    - condition: template
      value_template: '{{ filtered_log | length > 0 }}'
    then:
    - action: conversation.process
      continue_on_error: true
      data:
        agent_id: conversation.extended_openai_conversation_2
        text: >-
          Today is {{ now().strftime('%A, %B %d, %Y') }}. Read the following log of today's camera events:
          <camera_log>
          {{ filtered_log }}
          </camera_log>

          Write a cohesive evening security briefing summarizing the activity.
          Group similar events together (e.g. Package Deliveries, Visitors, Solicitors, Unusual Activity).
          Consolidate multiple events occurring within a few minutes of each other for the same visitor or delivery into a single entry (arrival and departure are part of the same visit; do not create duplicate bullet points for the same person arriving and leaving).
          Common-sense rules: Couriers and delivery drivers deliver packages; they never perform yard work or leaf blowing. If any entry mentions lawn tools or yard maintenance, treat it as household activity or exclude it from security alerts.
          Format your entire response using clean HTML (use <h3> for headers, <ul> and <li> for bullet points, and <b> for bold text). Do not wrap your response in markdown code blocks.
          Return ONLY raw HTML.
      response_variable: evening_rollup
  - action: smtp.send_message
    target:
      entity_id: notify.email_daily_rollup_flamingotter_hass_gmail_com
    data:
      title: Security Briefing - {{ now().strftime('%b %d, %Y') }}
      message: Please view this email in an HTML-compatible client.
      html: "{% if filtered_log | length == 0 %}\n  <h3>All clear. No visitor or delivery activity detected
        today.</h3>\n{% else %}\n  {% set resp = evening_rollup.response.speech.plain.speech
        | default('', true) if evening_rollup is defined and evening_rollup.response
        is defined and evening_rollup.response.speech is defined and evening_rollup.response.speech.plain
        is defined else '' %}\n  {% if resp | length > 0 %}\n    {{ resp | replace('```html',
        '') | replace('```', '') | trim }}\n  {% else %}\n    <h3>The daily security
        briefing could not be generated at this time.</h3>\n  {% endif %}\n{% endif
        %}"
