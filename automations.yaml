      - condition: trigger
        id:
        - t02
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.bambu_p1s_chamber_light
      alias: Turn off Chamber Light
  mode: single
- id: '1724262570606'
  alias: Alarm panel functions and mode actions
  description: ''
  triggers:
  - entity_id:
    - alarm_control_panel.home_alarm
    id: disarmed
    to: disarmed
    trigger: state
  - entity_id:
    - alarm_control_panel.home_alarm
    id: armed night
    to: armed_night
    trigger: state
  - entity_id:
    - alarm_control_panel.home_alarm
    id: armed
    to: armed_home
    trigger: state
  - entity_id:
    - alarm_control_panel.home_alarm
    id: armed away
    to: armed_away
    trigger: state
  - entity_id:
    - input_select.josh_status
    - input_select.mj_status
    id: person status
    alias: person status
    trigger: state
  - at: 08:00:00
    id: 0800
    alias: 0800
    trigger: time
  - trigger: state
    entity_id:
    - timer.timer_garage_spotlight
    to:
    - idle
    from:
    - active
    id: Spotlight Timer Complete
    alias: Spotlight Timer Complete
  - trigger: event
    event_type: zwave_js_notification
    event_data:
      device_id: 621aa1c4c9243ca0eb0bb5c81174a2c6
      command_class: 113
      type: 6
      event: 5
    id: garage_door_locked
    alias: When Garage Door is Locked
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - person status
      sequence:
      - choose:
        - conditions:
          - condition: not
            conditions:
            - condition: state
              entity_id: alarm_control_panel.home_alarm
              state: disarmed
            - condition: state
              entity_id: alarm_control_panel.home_alarm
              state: armed_night
            alias: Is Not Disarmed or Armed Night
          - alias: Josh is Home OR Just Arrived
            condition: or
            conditions:
            - condition: state
              entity_id: input_select.josh_status
              state: Just Arrived
            - condition: state
              entity_id: input_select.josh_status
              state: Home
          - condition: or
            conditions:
            - condition: state
              entity_id: input_select.mj_status
              state: Away
            - condition: state
              entity_id: input_select.mj_status
              state: Extended Away
            - condition: state
              entity_id: input_select.mj_status
              state: Work
            alias: MJ is in an Away State
          sequence:
          - action: notify.mobile_app_josh_mobile
            data:
              message: Josh has Arrived Home
              title: Disarmed
          - action: alarm_control_panel.alarm_disarm
            data:
              code: '1977'
            target:
              entity_id: alarm_control_panel.home_alarm
          alias: Josh Disarmed
        - conditions:
          - condition: not
            conditions:
            - condition: state
              entity_id: alarm_control_panel.home_alarm
              state: disarmed
            - condition: state
              entity_id: alarm_control_panel.home_alarm
              state: armed_night
            alias: Is Not Disarmed or Armed Night
          - alias: MJ is Home OR Just Arrived
            condition: or
            conditions:
            - condition: state
              entity_id: input_select.mj_status
              state: Just Arrived
            - condition: state
              entity_id: input_select.mj_status
              state: Home
          - alias: Josh is in an Away State
            condition: or
            conditions:
            - condition: state
              entity_id: input_select.josh_status
              state: Away
            - condition: state
              entity_id: input_select.josh_status
              state: Extended Away
            - condition: state
              entity_id: input_select.josh_status
              state: Work
          sequence:
          - action: notify.mobile_app_josh_mobile
            data:
              message: MJ has Arrived Home
              title: Disarmed
          - action: alarm_control_panel.alarm_disarm
            data:
              code: '1977'
            target:
              entity_id: alarm_control_panel.home_alarm
          alias: MJ Disarmed
        - conditions:
          - alias: Both Extended Away (Arm Vacation)
            condition: and
            conditions:
            - condition: state
              entity_id: input_select.josh_status
              state: Extended Away
            - condition: state
              entity_id: input_select.mj_status
              state: Extended Away
          sequence:
          - action: alarm_control_panel.alarm_arm_vacation
            target:
              entity_id: alarm_control_panel.home_alarm
          alias: Armed Vacation
        - conditions:
          - alias: Any Away State Combination (Arm Away)
            condition: and
            conditions:
            - condition: template
              value_template: '{{ states(''input_select.josh_status'') in [''Away'',
                ''Extended Away'', ''Work''] }}'
            - condition: template
              value_template: '{{ states(''input_select.mj_status'') in [''Away'',
                ''Extended Away'', ''Work''] }}'
          sequence:
          - if:
            - condition: state
              entity_id: input_boolean.house_guests
              state: 'on'
            then:
            - action: script.activate_mobile_actionable_notification
              data:
                notify_target: notify.mobile_app_josh_mobile
                title: Arm Away Verify
                message: Set home to Armed Away with House Guests?
                notify_tag: arm-guests
                notify_action_1: guests_arm
                notify_action_1_title: Arm
                notify_action_2: guests_ignore
                notify_action_2_title: Ignore
            else:
            - action: alarm_control_panel.alarm_arm_away
              target:
                entity_id: alarm_control_panel.home_alarm
          alias: Away / Away
      alias: When triggered by person status, set alarm panel mode.
    - conditions:
      - condition: trigger
        id:
        - armed away
      sequence:
      - parallel:
        - if:
          - condition: template
            value_template: "{%- set locks = state_attr('lock.door_locks', 'entity_id')
              -%} {%- if locks -%}\n  {{- locks | select('is_state', 'unlocked') |
              list | length > 0 -}}\n{%- else -%}\n  false\n{%- endif -%}"
          then:
          - action: lock.lock
            continue_on_error: true
            target:
              entity_id: '{%- set locks = state_attr(''lock.door_locks'', ''entity_id'')
                -%} {{- locks | select(''is_state'', ''unlocked'') | list -}}'
        - action: light.turn_off
          target:
            entity_id:
            - light.lights
            - light.bedroom
        - action: fan.turn_off
          metadata: {}
          target:
            entity_id:
            - fan.catio_fan_01
            - fan.catio_fan_02
          data: {}
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.reading_mode
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.camera_alerts
        - action: notify.mobile_app_josh_mobile
          data:
            title: Armed Away
            message: Both Josh and MJ are Away!
    - conditions:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - disarmed
        - condition: template
          value_template: '{{ trigger.from_state is not none and trigger.from_state.state
            != "armed_night" }}'
      alias: When triggered by disarmed
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.welcome_home_ai_debrief
        data: {}
      - parallel:
        - if:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
          then:
          - action: switch.turn_on
            target:
              entity_id: switch.garage_spot_light
        - action: timer.start
          data:
            duration: 00:05:00
          target:
            entity_id: timer.timer_garage_spotlight
    - conditions:
      - condition: trigger
        id:
        - 0800
      sequence:
      - action: media_player.volume_set
        data:
          volume_level: 0.3
        target:
          entity_id:
          - media_player.babe_cave
          - media_player.counter
          - media_player.dining_room
      - action: button.press
        metadata: {}
        target:
          entity_id: button.office_wake_on_lan_pc
        data: {}
    - conditions:
      - condition: trigger
        id:
        - Spotlight Timer Complete
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.garage_spot_light
    - conditions:
      - condition: trigger
        id:
        - garage_door_locked
      - condition: state
        entity_id: input_select.josh_status
        state:
        - Away
        - Extended Away
      - condition: state
        entity_id: input_select.mj_status
        state:
        - Away
        - Extended Away
      - condition: state
        entity_id: alarm_control_panel.home_alarm
        state: disarmed
