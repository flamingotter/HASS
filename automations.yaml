- id: '1778103562000'
  alias: 'Light Control: Office (v1.0)'
  description: Synchronizes Zooz ZEN73 switch (light.switch_office_light) with Office
    LIFX lights (light.office_lights).
  triggers:
  - id: top
    trigger: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: 0e70048e907adfc2b741d4fc88e5e1ad
      property_key: '001'
  - id: bottom
    trigger: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: 0e70048e907adfc2b741d4fc88e5e1ad
      property_key: '002'
  - id: switch_state_on
    trigger: state
    entity_id:
    - light.switch_office_light
    - switch.office_light
    to: 'on'
  - id: switch_state_off
    trigger: state
    entity_id:
    - light.switch_office_light
    - switch.office_light
    to: 'off'
  - id: light_state_on
    trigger: state
    entity_id: light.office_lights
    to: 'on'
  - id: light_state_off
    trigger: state
    entity_id: light.office_lights
    to: 'off'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''switch_state_on'', ''light_state_on'']
