      - action: switch.turn_on
        target:
          entity_id:
          - switch.catio_light_01
          - switch.catio_light_02
          - switch.catio_light_03
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''top'' and trigger.event.data.value ==
          ''KeyPressed'' }}'
      sequence:
      - action: lifx.effect_stop
        continue_on_error: true
        target:
          entity_id:
          - light.catio_lifx_01
          - light.catio_lifx_02
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id:
          - light.catio_lifx_01
          - light.catio_lifx_02
        data:
          color_temp_kelvin: 4500
          brightness_pct: 100
          transition: 2
      - action: switch.turn_on
        target:
          entity_id:
          - switch.catio_light_01
          - switch.catio_light_02
          - switch.catio_light_03
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''bottom'' and trigger.event.data.value
          == ''KeyPressed2x'' }}'
      sequence:
      - action: lifx.effect_stop
        continue_on_error: true
        target:
          entity_id:
          - light.catio_lifx_01
          - light.catio_lifx_02
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id:
          - light.catio_lifx_01
          - light.catio_lifx_02
        data:
          color_temp_kelvin: 4500
          transition: 2
      - action: switch.turn_on
        target:
          entity_id:
          - switch.catio_light_01
          - switch.catio_light_02
          - switch.catio_light_03
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''bottom'' and trigger.event.data.value
          == ''KeyPressed'' }}'
      sequence:
      - action: lifx.effect_stop
        continue_on_error: true
        target:
          entity_id:
          - light.catio_lifx_01
          - light.catio_lifx_02
      - action: light.turn_off
        continue_on_error: true
        target:
          entity_id:
          - light.catio_lifx_01
          - light.catio_lifx_02
        data:
          transition: 2
      - action: switch.turn_off
        target:
          entity_id:
          - switch.catio_light_01
          - switch.catio_light_02
          - switch.catio_light_03
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''light_state_on'' }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.catio_light_01
          - switch.catio_light_02
          - switch.catio_light_03
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''light_state_off'' }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.catio_light_01
          - switch.catio_light_02
          - switch.catio_light_03
  mode: restart
