        entity_id: alarm_control_panel.home_alarm
    - action: notify.all_devices
      data:
        message: clear_notification
        data:
          tag: arm-guests
  - alias: guests_ignore
    if:
    - condition: trigger
      id:
      - guests_ignore
    then:
    - action: notify.all_devices
      data:
        message: clear_notification
        data:
          tag: arm-guests
    - action: script.activate_mobile_actionable_notification
      data:
        notify_target: notify.all_devices
        title: Arm Away Verify
        message: Arming has been ignored.
        notify_tag: arm-guests-status
  - if:
    - condition: trigger
      id:
      - cleared
    - condition: template
