              The garage man door was locked. Guest mode cleared and the alarm has re-armed based on your current status.
            {%- else -%}
              The garage man door was locked and the alarm has re-armed based on your current status.
            {%- endif -%}
      alias: Sitter Departs / Smart Re-Arm
  mode: parallel
  max: 15
