      - if:
        - condition: template
          value_template: "{{ targets | length > 0 }}"
        then:
        - action: homeassistant.turn_on
          target:
            entity_id: "{{ targets }}"
    - conditions:
      - condition: template
        value_template: "{{ trigger.id in ['motion_off', 'switch_state_off'] or\n   (trigger.id ==
          'bottom' and trigger.event.data.value in ['KeyPressed', 'KeyPressed2x'])
          }}"
      sequence:
      - variables:
          targets: >-
            {{ ['switch.garage_entry_switch', 'light.garage_motion_switch'] | reject('is_state', 'off') | list }}
      - if:
        - condition: template
          value_template: "{{ targets | length > 0 }}"
        then:
        - action: homeassistant.turn_off
          target:
            entity_id: "{{ targets }}"
  mode: restart
- id: light_control_hallway_zen73_lifx
  alias: 'Light Control: Downstairs Hallway (v1.0)'
  description: Synchronizes Zooz ZEN73 switches (switch.hall_switch_01, switch.hall_switch_02)
    with LIFX light (light.hall_light) and maintains guide-light LED states.
  triggers:
  - id: top
    trigger: event
    event_type: zwave_js_value_notification
    event_data:
      property_key: '001'
  - id: bottom
    trigger: event
    event_type: zwave_js_value_notification
    event_data:
      property_key: '002'
  - id: light_state_on
    trigger: state
    entity_id: light.hall_light
    to: 'on'
  - id: light_state_off
    trigger: state
    entity_id: light.hall_light
    to: 'off'
  conditions:
  - condition: template
    value_template: "{{ trigger.id in ['light_state_on', 'light_state_off'] or\n   trigger.event.data.device_id
      in [\n     device_id('switch.hall_switch_01'),\n     device_id('switch.hall_switch_02')\n
      \  ] }}"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'light_state_on' or\n   (trigger.id == 'top'
          and trigger.event.data.value in ['KeyPressed', 'KeyPressed2x']) }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.hall_light
      - action: switch.turn_on
        target:
          entity_id:
          - switch.hall_switch_01
          - switch.hall_switch_02
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'light_state_off' or\n   (trigger.id ==
          'bottom' and trigger.event.data.value in ['KeyPressed', 'KeyPressed2x'])
          }}"
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.hall_light
      - action: switch.turn_off
        target:
          entity_id:
          - switch.hall_switch_01
          - switch.hall_switch_02
  mode: restart
- id: fan_control_catio_zen73_zen51
  alias: 'Fan Control: Catio (v1.0)'
  description: Synchronizes Zooz ZEN73 wall switches (switch.catio_fan_01, switch.catio_fan_02) with ZEN51 fan relays (fan.catio_fan_001, fan.catio_fan_002) in a unified dual pair setup with full guide-light LED synchronization.
  triggers:
  - id: top
    trigger: event
    event_type: zwave_js_value_notification
    event_data:
      property_key: '001'
  - id: bottom
    trigger: event
    event_type: zwave_js_value_notification
    event_data:
      property_key: '002'
  - id: fan_state_on
    trigger: state
    entity_id:
    - fan.catio_fan_001
    - fan.catio_fan_002
    to: 'on'
  - id: fan_state_off
    trigger: state
    entity_id:
    - fan.catio_fan_001
    - fan.catio_fan_002
    to: 'off'
  - id: switch_state_on
    trigger: state
    entity_id:
    - switch.catio_fan_01
    - switch.catio_fan_02
    to: 'on'
  - id: switch_state_off
    trigger: state
    entity_id:
    - switch.catio_fan_01
    - switch.catio_fan_02
    to: 'off'
  conditions:
  - condition: template
    value_template: >-
      {{ trigger.id in ['fan_state_on', 'fan_state_off', 'switch_state_on', 'switch_state_off'] or
         trigger.event.data.device_id in [
           device_id('switch.catio_fan_01'),
           device_id('switch.catio_fan_02')
         ] }}
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: >-
          {{ trigger.id in ['fan_state_on', 'switch_state_on'] or
             (trigger.id == 'top' and trigger.event.data.value in ['KeyPressed', 'KeyPressed2x']) }}
      sequence:
      - action: fan.turn_on
        target:
          entity_id:
          - fan.catio_fan_001
          - fan.catio_fan_002
      - action: switch.turn_on
        target:
          entity_id:
          - switch.catio_fan_01
          - switch.catio_fan_02
    - conditions:
      - condition: template
        value_template: >-
          {{ trigger.id in ['fan_state_off', 'switch_state_off'] or
             (trigger.id == 'bottom' and trigger.event.data.value in ['KeyPressed', 'KeyPressed2x']) }}
      sequence:
      - action: fan.turn_off
        target:
          entity_id:
          - fan.catio_fan_001
          - fan.catio_fan_002
      - action: switch.turn_off
        target:
          entity_id:
          - switch.catio_fan_01
          - switch.catio_fan_02
  mode: restart
- id: climate_whole_home_coordinator_v1_0
  alias: 'Climate: Whole-Home Thermostat Coordinator (v1.0)'
  description: Unified thermal orchestration across all seasons for Floor 1 (Downstairs)
    and Floor 2 (Upstairs) Trane heat pumps.
  triggers:
  - trigger: time
    at: 07:00:00
    id: wake_up
  - trigger: time
    at: input_datetime.bedroom_bedtime
    id: bedtime
  - trigger: time
    at: '22:30:00'
    id: bedtime_fallback
  - trigger: state
    entity_id: input_boolean.eco_mode
    id: eco_mode
  - trigger: state
    entity_id:
    - climate.t6_pro_downstairs
    - climate.t6_pro_upstairs
    to:
    - cool
    - heat
    id: mode_changed
  - trigger: homeassistant
    event: start
    id: boot
  actions:
  - variables:
      b: '{{ states(''input_datetime.bedroom_bedtime'') }}'
      bedtime_str: '{{ b if b not in [''unknown'', ''unavailable'', ''None''] else
        ''22:30:00'' }}'
      is_night: '{{ now() >= today_at(bedtime_str) or now().hour < 7 }}'
      is_eco: '{{ is_state(''input_boolean.eco_mode'', ''on'') }}'
      upstairs_target_cool: '{{ 78 if is_eco else (76 if is_night else 73) }}'
      upstairs_target_heat: '{{ 64 if is_eco else (62 if is_night else 67) }}'
      upstairs_desired: "{%- if is_state('climate.t6_pro_upstairs', 'cool') -%}\n
        \ {{ upstairs_target_cool | int(73) }}\n{%- elif is_state('climate.t6_pro_upstairs',
        'heat') -%}\n  {{ upstairs_target_heat | int(67) }}\n{%- else -%}\n  {{ upstairs_target_cool
        | int(73) }}\n{%- endif -%}"
      upstairs_current: '{{ state_attr(''climate.t6_pro_upstairs'', ''temperature'')
        | float(0) }}'
      downstairs_target_heat: '{{ 66 if is_eco else (64 if is_night else 68) }}'
      downstairs_target_cool: '{{ 74 if is_eco else 70 }}'
      downstairs_current: '{{ state_attr(''climate.t6_pro_downstairs'', ''temperature'')
        | float(0) }}'
  - if:
    - condition: template
      value_template: '{{ states(''climate.t6_pro_upstairs'') in [''cool'', ''heat'',
        ''auto''] and upstairs_current != (upstairs_desired | float) }}'
    then:
    - action: climate.set_temperature
      target:
        entity_id: climate.t6_pro_upstairs
      data:
        temperature: '{{ upstairs_desired }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''climate.t6_pro_downstairs'', ''heat'') and downstairs_current
        != (downstairs_target_heat | float) }}'
    then:
    - action: climate.set_temperature
      target:
        entity_id: climate.t6_pro_downstairs
      data:
        temperature: '{{ downstairs_target_heat }}'
    - if:
      - condition: template
        value_template: '{{ is_night }}'
      then:
      - action: switch.turn_on
        target:
          entity_id: switch.bedroom_humidifier
  mode: single
- id: appliance_cycle_and_consumables_tracker
  alias: 'Appliance: Cycle and Consumables Tracker'
  description: Automatically monitors washer, dryer, and dishwasher cycles, alerts
    upon completion, and manages detergent and dishwasher tab consumables.
  triggers:
  - trigger: state
    entity_id: binary_sensor.washing_machine_running
    from: 'on'
    to: 'off'
    id: washer_finished
  - trigger: state
    entity_id: binary_sensor.clothes_dryer_running
    from: 'on'
    to: 'off'
    id: dryer_finished
    enabled: true
  - trigger: state
    entity_id: binary_sensor.dishwasher_running
    from: 'on'
    to: 'off'
    id: dishwasher_finished
  - trigger: state
    entity_id: input_button.reset_laundry_detergent
    id: reset_detergent
  - trigger: state
    entity_id: input_button.reset_dishwasher_tabs
    id: reset_dishwasher
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: washer_finished
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.laundry_detergent_loads_remaining
        data:
          value: '{{ [states(''input_number.laundry_detergent_loads_remaining'') |
            int(1) - 1, 0] | max }}'
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.mobile_app_josh_mobile
          title: "\U0001F9FA Washing Machine Finished"
          message: Wash cycle complete! Time to move clothes to the dryer. ({{ [states('input_number.laundry_detergent_loads_remaining')
            | int(0), 0] | max }} detergent loads left)
          notify_tag: laundry-washer-notify
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.mobile_app_mj_pixel_8_pro
          title: "\U0001F9FA Washing Machine Finished"
          message: Wash cycle complete! Time to move clothes to the dryer.
          notify_tag: laundry-washer-notify
      - if:
        - condition: template
          value_template: '{{ states(''input_number.laundry_detergent_loads_remaining'')
            | int(0) <= 5 }}'
        then:
        - action: script.activate_mobile_actionable_notification
          data:
            notify_target: notify.mobile_app_josh_mobile
            title: ⚠️ Laundry Detergent Low
            message: Only {{ states('input_number.laundry_detergent_loads_remaining')
              | int(0) }} loads of detergent remaining. Time to restock!
            notify_tag: laundry-detergent-low
    - conditions:
      - condition: trigger
        id: dryer_finished
      sequence:
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.mobile_app_josh_mobile
          title: "\U0001F455 Clothes Dryer Finished"
          message: Dryer cycle complete! Clothes are ready to fold.
          notify_tag: laundry-dryer-notify
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.mobile_app_mj_pixel_8_pro
          title: "\U0001F455 Clothes Dryer Finished"
          message: Dryer cycle complete! Clothes are ready to fold.
          notify_tag: laundry-dryer-notify
    - conditions:
      - condition: trigger
        id: dishwasher_finished
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.dishwasher_tabs_remaining
        data:
          value: '{{ [states(''input_number.dishwasher_tabs_remaining'') | int(1)
            - 1, 0] | max }}'
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.mobile_app_josh_mobile
          title: "\U0001F37D️ Dishwasher Finished"
          message: Dishwasher cycle complete! Clean dishes are ready to unload. ({{
            [states('input_number.dishwasher_tabs_remaining') | int(0), 0] | max }}
            tabs left)
          notify_tag: dishwasher-notify
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.mobile_app_mj_pixel_8_pro
          title: "\U0001F37D️ Dishwasher Finished"
          message: Dishwasher cycle complete! Clean dishes are ready to unload.
          notify_tag: dishwasher-notify
      - if:
        - condition: template
          value_template: '{{ states(''input_number.dishwasher_tabs_remaining'') |
            int(0) <= 5 }}'
        then:
        - action: script.activate_mobile_actionable_notification
          data:
            notify_target: notify.mobile_app_josh_mobile
            title: ⚠️ Dishwasher Tabs Low
            message: Only {{ states('input_number.dishwasher_tabs_remaining') | int(0)
              }} dishwasher tabs remaining. Time to restock!
            notify_tag: dishwasher-tabs-low
    - conditions:
      - condition: trigger
        id: reset_detergent
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.laundry_detergent_loads_remaining
        data:
          value: '{{ states(''input_number.laundry_detergent_restock_quantity'') |
            int(96) }}'
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.mobile_app_josh_mobile
          title: "🧺 Detergent Restocked"
          message: Laundry detergent inventory reset to {{ states('input_number.laundry_detergent_loads_remaining') | int(96) }} loads.
          notify_tag: detergent-restock
    - conditions:
      - condition: trigger
        id: reset_dishwasher
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.dishwasher_tabs_remaining
        data:
          value: '{{ states(''input_number.dishwasher_tabs_restock_quantity'') | int(60)
            }}'
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.mobile_app_josh_mobile
          title: "🍽️ Dishwasher Tabs Restocked"
          message: Dishwasher tabs inventory reset to {{ states('input_number.dishwasher_tabs_remaining') | int(60) }} tabs.
          notify_tag: dishwasher-restock
  mode: parallel
  max: 5
- id: security_patio_perimeter_alert
  alias: 'Security: Patio Perimeter Alert (Night & Away)'
  description: Sends actionable security alerts with live camera snapshot and UniFi Protect deep-link when person is detected on Patio while sleeping or away.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.patio_left_person_detected
    - binary_sensor.patio_right_person_detected
    to: 'on'
    id: detection
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: patio_turn_on_floodlights
    id: turn_on_lights
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: patio_dismiss_alert
    id: dismiss
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: detection
      - condition: or
        conditions:
        - condition: state
          entity_id: alarm_control_panel.home_alarm
          state:
          - armed_night
          - armed_away
          - armed_vacation
        - condition: and
          conditions:
          - condition: state
            entity_id: person.josh
            state: not_home
          - condition: state
            entity_id: person.mj
            state: not_home
      sequence:
      - variables:
          cam_entity: >-
            {{ 'camera.patio_left_high_resolution_channel' if 'patio_left' in trigger.entity_id else 'camera.patio_right_high_resolution_channel' }}
          cam_name: >-
            {{ 'Patio Left' if 'patio_left' in trigger.entity_id else 'Patio Right' }}
          alert_mode: >-
            {{ 'Perimeter Alert (Armed Night)' if is_state('alarm_control_panel.home_alarm', 'armed_night') else 'Perimeter Alert (Away)' }}
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.all_devices
          title: '🚨 {{ alert_mode }}: {{ cam_name }}'
          message: 'Person detected on {{ cam_name }}. Tap image to open live UniFi Protect feed.'
          notify_tag: patio-security-alert
          priority: high
          image: '/api/camera_proxy/{{ cam_entity }}'
          clickAction: 'app://com.ubnt.unifi.protect'
          notify_action_1: 'URI'
          notify_action_1_title: '🔴 Open Protect'
          notify_action_1_uri: 'app://com.ubnt.unifi.protect'
          notify_action_2: 'patio_turn_on_floodlights'
          notify_action_2_title: '💡 Turn On Lights'
          notify_action_3: 'patio_dismiss_alert'
          notify_action_3_title: 'Dismiss'
    - conditions:
      - condition: trigger
        id: turn_on_lights
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.backyard_lights
      - action: notify.all_devices
        data:
          message: clear_notification
          data:
            tag: patio-security-alert
    - conditions:
      - condition: trigger
        id: dismiss
      sequence:
      - action: notify.all_devices
        data:
          message: clear_notification
          data:
            tag: patio-security-alert
  mode: single
  max_exceeded: silent
