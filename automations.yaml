      {%- set repo = raw | from_json(default={}) if raw not in ['', 'unknown', 'unavailable', None] else {} -%}
      {%- set last_ts = repo.get(trigger.entity_id, 0) | float(0) -%}
      {{ (as_timestamp(now()) - last_ts) >= 30 }}
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.door_announce_cooldown
    data:
      value: >-
