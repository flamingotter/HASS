        data:
          notify_target: notify.all_devices
          title: Trash and Recycling
          message: >-
            {% set resp = generated_content.response.speech.plain.speech | default('', true) if generated_content is defined and generated_content.response is defined and generated_content.response.speech is defined and generated_content.response.speech.plain is defined else '' %}
            {{ resp | trim | replace('\"', '') if resp | length > 0 else "The trash isn't going to take itself out." }}
          notify_tag: trash-notify
          notify_action_1: trash_done
          notify_action_1_title: Done
          notify_action_2: trash_passon
          notify_action_2_title: Ask Other
          notify_action_3: trash_delay
          notify_action_3_title: Delay 24hr
    - conditions:
      - condition: trigger
        id: trash_delay
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.trash_reminder
      - action: notify.all_devices
        data:
          message: clear_notification
          data:
            tag: trash-notify
      - delay:
          hours: 24
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.trash_reminder
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.all_devices
          title: Trash and Recycling
          message: Put to the Curb
          notify_tag: trash-notify
          notify_action_1: trash_done
          notify_action_1_title: Done
          notify_action_2: trash_passon
          notify_action_2_title: Ask Other
          notify_action_3: trash_delay
          notify_action_3_title: Delay 24hr
  variables:
