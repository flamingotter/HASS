          target:
            entity_id: '{{ targets }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''switch_state_off'', ''light_state_off'']
          or (trigger.id == ''bottom'' and trigger.event.data.value in [''KeyPressed'',
          ''KeyPressed2x'']) }}'
      sequence:
      - variables:
          targets: '{{ [''light.office_lights'', ''light.switch_office_light''] |
            reject(''is_state'', ''off'') | list }}'
      - if:
        - condition: template
          value_template: '{{ targets | length > 0 }}'
        then:
        - action: light.turn_off
          target:
            entity_id: '{{ targets }}'
