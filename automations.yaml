- id: '1773788016200'
  alias: 'Door Security: Safety & Armed Alerts'
  description: Immediate alerts if armed + 3-minute siren alerts for open doors.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.garage_man_door
    - binary_sensor.front_door
    - binary_sensor.bedroom_door
    from:
    - 'off'
    to:
    - 'on'
    id: door_opened
  - trigger: state
    entity_id:
    - binary_sensor.garage_man_door
    - binary_sensor.front_door
    - binary_sensor.bedroom_door
    - binary_sensor.pantry_door
    from:
    - 'off'
    to:
    - 'on'
    for:
      hours: 0
      minutes: 3
      seconds: 0
    id: long_open
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: door_opened
      - condition: state
        entity_id: alarm_control_panel.home_alarm
        state:
        - armed_away
        - armed_vacation
      sequence:
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.mobile_app_josh_mobile
          title: ⚠️ SECURITY ALERT
          message: The {{ state_attr(trigger.entity_id, 'friendly_name') }} was opened while ARMED!
          priority: high
          channel: alarm_stream
    - conditions:
      - condition: trigger
        id: long_open
      sequence:
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: alarm_control_panel.home_alarm
            state: armed_night
        then:
        - action: siren.turn_on
          target:
            entity_id:
            - siren.downstairs_siren_chime_play_tone
            - siren.bedroom_siren_chime_play_tone
            - siren.office_siren_chime_play_tone
          data:
            tone: '{{ door_map[trigger.entity_id].long | default(1) }}'
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.all_devices
          title: Door Open
          message: The {{ state_attr(trigger.entity_id, 'friendly_name') }} is Open!
  variables:
    door_map:
      binary_sensor.bedroom_door:
        long: 9
      binary_sensor.front_door:
        long: 7
      binary_sensor.garage_man_door:
        long: 6
      binary_sensor.pantry_door:
        long: 1
  mode: parallel
  max: 10
