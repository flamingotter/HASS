- id: '1724262570606'
  alias: Alarm panel functions and mode actions
  description: ''
  triggers:
  - entity_id:
    - alarm_control_panel.home_alarm
    id: disarmed
    to: disarmed
    trigger: state
  - entity_id:
    - alarm_control_panel.home_alarm
    id: armed night
    to: armed_night
    trigger: state
  - entity_id:
    - alarm_control_panel.home_alarm
    id: armed
    to: armed_home
    trigger: state
  - entity_id:
    - alarm_control_panel.home_alarm
    id: armed away
    to: armed_away
    trigger: state
  - entity_id:
    - input_select.josh_status
    - input_select.mj_status
    id: person status
    alias: person status
    trigger: state
  - at: 08:00:00
    id: 0800
    alias: 0800
    trigger: time
  - trigger: state
    entity_id:
    - timer.timer_garage_spotlight
    to:
    - idle
    from:
    - active
    id: Spotlight Timer Complete
    alias: Spotlight Timer Complete
  - trigger: event
    event_type: zwave_js_notification
    event_data:
      device_id: 621aa1c4c9243ca0eb0bb5c81174a2c6
      command_class: 113
      type: 6
      event: 5
    id: garage_door_locked
    alias: When Garage Door is Locked
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - person status
      sequence:
      - choose:
        - conditions:
          - condition: not
            conditions:
            - condition: state
              entity_id: alarm_control_panel.home_alarm
              state: disarmed
            - condition: state
              entity_id: alarm_control_panel.home_alarm
              state: armed_night
            alias: Is Not Disarmed or Armed Night
          - alias: Josh is Home OR Just Arrived
            condition: or
            conditions:
            - condition: state
              entity_id: input_select.josh_status
              state: Just Arrived
            - condition: state
              entity_id: input_select.josh_status
              state: Home
          - condition: or
            conditions:
            - condition: state
              entity_id: input_select.mj_status
              state: Away
            - condition: state
              entity_id: input_select.mj_status
              state: Extended Away
            - condition: state
              entity_id: input_select.mj_status
              state: Work
            alias: MJ is in an Away State
          sequence:
          - action: notify.mobile_app_josh_mobile
            data:
              message: Josh has Arrived Home
              title: Disarmed
          - action: alarm_control_panel.alarm_disarm
            data:
              code: '1977'
            target:
              entity_id: alarm_control_panel.home_alarm
          alias: Josh Disarmed
        - conditions:
          - condition: not
            conditions:
            - condition: state
              entity_id: alarm_control_panel.home_alarm
              state: disarmed
            - condition: state
              entity_id: alarm_control_panel.home_alarm
              state: armed_night
            alias: Is Not Disarmed or Armed Night
          - alias: MJ is Home OR Just Arrived
            condition: or
            conditions:
            - condition: state
              entity_id: input_select.mj_status
              state: Just Arrived
            - condition: state
              entity_id: input_select.mj_status
              state: Home
          - alias: Josh is in an Away State
            condition: or
            conditions:
            - condition: state
              entity_id: input_select.josh_status
              state: Away
            - condition: state
              entity_id: input_select.josh_status
              state: Extended Away
            - condition: state
              entity_id: input_select.josh_status
              state: Work
          sequence:
          - action: notify.mobile_app_josh_mobile
            data:
              message: MJ has Arrived Home
              title: Disarmed
          - action: alarm_control_panel.alarm_disarm
            data:
              code: '1977'
            target:
              entity_id: alarm_control_panel.home_alarm
          alias: MJ Disarmed
        - conditions:
          - alias: Both Extended Away (Arm Vacation)
            condition: and
            conditions:
            - condition: state
              entity_id: input_select.josh_status
              state: Extended Away
            - condition: state
              entity_id: input_select.mj_status
              state: Extended Away
          sequence:
          - action: alarm_control_panel.alarm_arm_vacation
            target:
              entity_id: alarm_control_panel.home_alarm
          alias: Armed Vacation
        - conditions:
          - alias: Any Away State Combination (Arm Away)
            condition: and
            conditions:
            - condition: template
              value_template: '{{ states(''input_select.josh_status'') in [''Away'',
                ''Extended Away'', ''Work''] }}'
            - condition: template
              value_template: '{{ states(''input_select.mj_status'') in [''Away'',
                ''Extended Away'', ''Work''] }}'
          sequence:
          - if:
            - condition: state
              entity_id: input_boolean.house_guests
              state: 'on'
            then:
            - action: script.activate_mobile_actionable_notification
              data:
                notify_target: notify.mobile_app_josh_mobile
                title: Arm Away Verify
                message: Set home to Armed Away with House Guests?
                notify_tag: arm-guests
                notify_action_1: guests_arm
