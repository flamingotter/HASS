    alias: Pass on
  - event_type: mobile_app_notification_action
    event_data:
      action: trash_delay
    id: trash_delay
    trigger: event
    alias: Delay
  - event_type: mobile_app_notification_cleared
    event_data:
      tag: trash-notify
    id: trash_cleared
    trigger: event
    alias: Cleared
  - trigger: tag
    tag_id: trash_done
    id: trash_tag_scanned
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.trash_day
        state: 'on'
      - condition: trigger
        id: trash_time
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.trash_reminder
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.all_devices
          title: Trash and Recycling
          message: Put to the Curb
          notify_tag: trash-notify
          notify_action_1: trash_done
          notify_action_1_title: Done
          notify_action_2: trash_passon
          notify_action_2_title: Ask Other
          notify_action_3: trash_delay
          notify_action_3_title: Delay 24hr
    - conditions:
      - or:
        - condition: trigger
          id: trash_done
        - condition: trigger
          id: trash_tag_scanned
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.trash_reminder
      - action: notify.all_devices
        data:
          message: clear_notification
          data:
            tag: trash-notify
      - variables:
          scanned_device: '{{ trigger.device_id | default(trigger.event.data.device_id)
            | default("unknown") }}'
          scanned_name: '{{ "Josh" if scanned_device == josh_device_id else "MJ" }}'
          target_notify: '{{ "notify.mobile_app_mj_pixel_8_pro" if scanned_name ==
            "Josh" else "notify.mobile_app_josh_mobile" }}'
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: '{{ target_notify }}'
          title: Trash and Recycling
          message: '{{ scanned_name }} Completed'
          notify_tag: trash-status
    - conditions:
      - condition: trigger
        id: trash_passon
      sequence:
      - variables:
          scanned_device: '{{ trigger.device_id | default(trigger.event.data.device_id)
            | default("unknown") }}'
          scanned_name: '{{ "Josh" if scanned_device == josh_device_id else "MJ" }}'
          target_notify: '{{ "notify.mobile_app_mj_pixel_8_pro" if scanned_name ==
            "Josh" else "notify.mobile_app_josh_mobile" }}'
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: '{{ target_notify }}'
          title: Trash and Recycling
          message: YOU'RE MY ONLY HOPE.
          notify_tag: trash-notify
          notify_action_1: trash_done
          notify_action_1_title: Done
    - conditions:
      - condition: trigger
        id: trash_cleared
      - condition: state
        entity_id: input_boolean.trash_reminder
        state: 'on'
      sequence:
      - action: conversation.process
        continue_on_error: true
        data:
          agent_id: conversation.extended_openai_conversation_2
          text: 'Rewrite this in a creative, witty, or humorous way (limit to about
            35 words, no quotes): "The trash isn''t going to take itself out."'
        response_variable: generated_content
      - delay:
          seconds: 2
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.all_devices
          title: Trash and Recycling
          message: '{% set resp = generated_content.response.speech.plain.speech |
            default('''', true) if generated_content is defined and generated_content.response
            is defined and generated_content.response.speech is defined and generated_content.response.speech.plain
            is defined else '''' %} {{ resp | trim | replace(''\"'', '''') if resp
            | length > 0 else "The trash isn''t going to take itself out." }}'
          notify_tag: trash-notify
          notify_action_1: trash_done
          notify_action_1_title: Done
          notify_action_2: trash_passon
          notify_action_2_title: Ask Other
          notify_action_3: trash_delay
          notify_action_3_title: Delay 24hr
    - conditions:
      - condition: trigger
        id: trash_delay
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.trash_reminder
      - action: notify.all_devices
        data:
          message: clear_notification
          data:
            tag: trash-notify
      - delay:
          hours: 24
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.trash_reminder
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.all_devices
          title: Trash and Recycling
          message: Put to the Curb
          notify_tag: trash-notify
          notify_action_1: trash_done
          notify_action_1_title: Done
          notify_action_2: trash_passon
          notify_action_2_title: Ask Other
          notify_action_3: trash_delay
          notify_action_3_title: Delay 24hr
  variables:
    josh_device_id: d818035824cf47ea
    mj_device_id: 0aa560faf0e8784c
  mode: parallel
  max: 10
