        | round(0) }}W) for over 2.5 hours continuously.  Upstairs Temp: {{ states(''climate.t6_pro_upstairs'')
        }}°F.  Check for open doors, thermal leakage from office, or failed zone equipment.'
      notify_tag: upstairs-hvac-runaway
      priority: high
  mode: single
- id: hvac_office_minisplit_failure_alert
  alias: 'Climate: Office Mini-Split Failure Alert'
  description: Alerts if office temperature is elevated during the day while mini-split
    power is idle/off.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.office_sensor_air_temperature
    above: 77.0
    for:
      minutes: 30
  conditions:
  - condition: numeric_state
    entity_id: sensor.panel_01_mini_split_power
    below: 30
  - condition: time
    after: 08:00:00
    before: '18:00:00'
  actions:
  - action: script.activate_mobile_actionable_notification
    data:
      notify_target: notify.mobile_app_josh_mobile
      title: ⚠️ Office Mini-Split Failure / Offline
      message: Office temperature has reached {{ states('sensor.office_sensor_air_temperature')
        }}°F, but the mini-split is drawing only {{ states('sensor.panel_01_mini_split_power')
        | round(1) }}W. Verify power and unit status.
      notify_tag: office-minisplit-offline
      priority: high
  mode: single
- id: ai_climate_mbr_v7_0
  alias: 'Climate: Sleep Comfort Engine (v7.8.6)'
  description: 'v7.8.6: Adaptive Velocity. Automatic learning weight adjustment (90/10
    vs 70/30) based on convergence.'
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.mbr_pre_cooling_active
    - sensor.bedroom_temperature_smoothed
    - climate.t6_pro_downstairs
    - input_boolean.eco_mode
  - trigger: time
    at: 07:00:00
    id: wake_up
  - trigger: time
    at: '19:00:00'
    id: strategist
  - trigger: time
    at: input_datetime.bedroom_bedtime
    id: bedtime
  - trigger: homeassistant
    event: start
    id: boot
  conditions:
  - condition: state
    entity_id: climate.t6_pro_downstairs
    state: cool
  actions:
  - variables:
      target: '{{ states(''input_number.bedroom_target_temperature'') | float(68)
        }}'
      actual: '{% set bdr = states(''sensor.bedroom_temperature_smoothed'') %} {%
        set t6 = state_attr(''climate.t6_pro_downstairs'', ''current_temperature'')
        %} {{ bdr | float(t6 | float(72)) }}

        '
      is_sleep_window: '{% set b = states(''input_datetime.bedroom_bedtime'') %} {%
        set bedtime_str = b if b not in [''unknown'', ''unavailable'', ''None''] else
        ''22:30:00'' %} {{ now() >= today_at(bedtime_str) or now().hour < 7 }}

        '
      t6_target: '{{ state_attr(''climate.t6_pro_downstairs'', ''temperature'') |
        float(68) }}'
      is_precooling: '{{ is_state(''binary_sensor.mbr_pre_cooling_active'', ''on'')
        }}'
      log_entity: notify.local_climate_control_log
  - choose:
    - alias: 'Override: Eco Mode Active'
      conditions:
      - condition: state
        entity_id: input_boolean.eco_mode
        state: 'on'
      sequence:
      - stop: Eco Mode Active
    - alias: 'AI Strategy: Evening Free Cooling Audit'
      conditions:
      - condition: trigger
        id: strategist
      - condition: template
        alias: Free Cooling Viability Gate (Outdoor >= 3F cooler and humidity < 65%)
        value_template: '{%- set out_temp = states(''sensor.weather_station_temperature_outdoor'')
          | float(100) -%} {%- set out_hum = states(''sensor.weather_station_humidity_outdoor'')
          | float(100) -%} {{ out_temp <= (actual - 3.0) and out_hum < 65 }}'
      sequence:
      - action: conversation.process
        continue_on_error: true
        data:
          agent_id: conversation.extended_openai_conversation_2
          text: Outdoor temp is {{ states('sensor.weather_station_temperature_outdoor')
            }}F with {{ states('sensor.weather_station_humidity_outdoor') }}% humidity.
            Bedroom temp is {{ actual }}F. Give a short, helpful 1-sentence tip recommending
            opening the screened patio door for free cooling. Keep response under
            25 words, no quotes.
        response_variable: strategist_advice
      - action: notify.mobile_app_josh_mobile
        data:
          title: "\U0001F343 Free Cooling Opportunity"
          message: '{% set resp = strategist_advice.response.speech.plain.speech |
            default('''', true) if strategist_advice is defined and strategist_advice.response
            is defined and strategist_advice.response.speech is defined and strategist_advice.response.speech.plain
            is defined else '''' %} {{ resp | trim | replace(''\"'', '''') if resp
            | length > 0 else (''Outdoor air is cooler and dry ('' ~ states(''sensor.weather_station_temperature_outdoor'')
            ~ ''°F / '' ~ states(''sensor.weather_station_humidity_outdoor'') ~ ''%).
            Consider opening the patio door to save energy.'') }}'
      - action: notify.send_message
        target:
          entity_id: '{{ log_entity }}'
        data:
          message: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }},FREE_COOLING_ADVISED,Outdoor:{{
            states(''sensor.weather_station_temperature_outdoor'') }}F,Humidity:{{
            states(''sensor.weather_station_humidity_outdoor'') }}%,Indoor:{{ actual
            }}F'
    - alias: 'Phase 1: Wake Up (Reset to Neutral)'
      conditions:
      - condition: trigger
        id: wake_up
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.t6_pro_downstairs
        data:
          temperature: 70
      - action: notify.send_message
        target:
          entity_id: '{{ log_entity }}'
        data:
          message: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }},PHASE_1_WAKEUP,Indoor:
            {{ actual }},Resetting to 70F'
    - alias: 'Phase 2: Pre-Cooling (AI Adjusted Start)'
      conditions:
      - condition: template
        value_template: '{{ is_precooling and not is_sleep_window and t6_target !=
          60 and actual > (target + 0.5) }}'
      sequence:
      - action: conversation.process
        continue_on_error: true
        data:
          agent_id: conversation.extended_openai_conversation_2
          text: 'The current target is {{ target }}F. The indoor humidity is {{ states(''sensor.bedroom_sensor_humidity'')
            }}%. If humidity is > 55%, recommend dropping target by 1 degree for ''Comfort-Adjusted''
            cooling. Return your response in the format: [VALUE] Reasoning: [One sentence
            explanation].'
        response_variable: comfort_target
      - variables:
          ai_raw: '{% set resp = comfort_target.response.speech.plain.speech | default('''',
            true) if comfort_target is defined and comfort_target.response is defined
            and comfort_target.response.speech is defined and comfort_target.response.speech.plain
            is defined else '''' %} {{ resp | trim if resp | length > 0 else (target
            | string) }}'
          ai_target: '{{ ai_raw.split('']'')[0] | replace(''['', '''') | replace(''F'',
            '''') | trim | float(target) }}'
          ai_reason: '{{ ai_raw.split(''Reasoning:'')[1] | default(''Standard target
            used.'') | trim }}'
      - delay: 00:02:00
      - variables:
          actual_now: '{% set bdr = states(''sensor.bedroom_temperature_smoothed'')
            %} {% set t6 = state_attr(''climate.t6_pro_downstairs'', ''current_temperature'')
            %} {{ bdr | float(t6 | float(72)) }}

            '
      - if:
        - condition: template
          value_template: '{{ actual_now <= ai_target }}'
        then:
        - stop: Sensor jitter or AI target met during validation delay.
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.precool_start_time
        data:
          datetime: '{{ now() }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.precool_start_temp
        data:
          value: '{{ actual }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.precool_start_outdoor_temp
        data:
          value: '{{ states(''sensor.weather_station_temperature_outdoor'') | float(70)
            }}'
      - action: notify.mobile_app_josh_mobile
        data:
          title: 'Climate: Pre-Cool Started'
          message: 'Target: {{ ai_target }}F (AI Adj). {{ ai_reason }} Room: {{ actual
            }}F | Outdoor: {{ states(''sensor.weather_station_temperature_outdoor'')
            }}F | Est: {{ ( (actual - ai_target) * state_attr(''binary_sensor.mbr_pre_cooling_active'',
            ''observed_rate_used'') | float ) | round(0) }} mins.'
      - action: notify.send_message
        target:
          entity_id: '{{ log_entity }}'
        data:
          message: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }},PHASE_2_START,Indoor:
            {{ actual }},Target: {{ ai_target }},Outdoor: {{ states(''sensor.weather_station_temperature_outdoor'')
            }},AI_Reason: {{ ai_reason | trim }}'
      - action: climate.set_temperature
        target:
          entity_id: climate.t6_pro_downstairs
        data:
          temperature: 60
    - alias: 'Phase 3: Pre-Cooling Complete (Handoff & AI Auditor)'
      conditions:
      - condition: template
        alias: 'Latch: Only run if currently in Agonal Push'
        value_template: '{{ t6_target == 60 }}'
      - or:
        - condition: template
          value_template: '{{ actual <= target }}'
        - condition: trigger
          id: bedtime
      sequence:
      - action: notify.send_message
        target:
          entity_id: '{{ log_entity }}'
        data:
          message: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }},PHASE_3_HANDOFF,Indoor:
            {{ actual }},Handing off to target {{ target }}'
      - action: climate.set_temperature
        target:
          entity_id: climate.t6_pro_downstairs
        data:
          temperature: '{{ target }}'
      - variables:
          start_ts: '{{ state_attr(''input_datetime.precool_start_time'', ''timestamp'')
            | float(as_timestamp(now())) }}'
          duration: '{{ [ (as_timestamp(now()) - start_ts) / 60, 1 ] | max }}'
          start_temp: '{{ states(''input_number.precool_start_temp'') | float(actual)
            }}'
          current_temp: '{{ states(''sensor.bedroom_temperature_smoothed'') | float(actual)
            }}'
          drop: '{{ start_temp - current_temp }}'
          obs_rate: '{{ (duration / drop) | round(1) if drop > 0.1 else 999.0 }}'
      - if:
        - condition: template
          alias: Minimum Run Time Check (5 minutes)
          value_template: '{{ duration < 5 and trigger.id != ''bedtime'' }}'
        then:
        - action: notify.send_message
          target:
            entity_id: '{{ log_entity }}'
          data:
            message: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }},PHASE_3_HANDOFF_NO_LEARN,Indoor:
              {{ actual }},NOTE: Min run time not met ({{ duration | round(1) }}m)
              - skipping audit.'
        - stop: Minimum run time not met. Handoff performed without learning.
      - if:
        - condition: template
          alias: AI Integrity Audit & Learning Gate
          value_template: '{{ duration >= 5 }}'
        then:
        - variables:
            avg_outdoor: '{% set start = states(''input_number.precool_start_outdoor_temp'')
              | float(70) %} {% set current = states(''sensor.weather_station_temperature_outdoor'')
              | float(70) %} {{ ((start + current) / 2) | round(1) }}'
            lookup_key: '{{ ((avg_outdoor | float / 5) | round(0) | int * 5) | string
              | trim }}'
        - action: conversation.process
          continue_on_error: true
          data:
            agent_id: conversation.extended_openai_conversation_2
            text: 'A residential AC cooling session took {{ duration | round(1) }}
              minutes to lower room temperature by {{ drop | round(1) }}°F (equivalent
              to {{ obs_rate }} minutes per degree). Average outdoor temperature during
              this session was {{ avg_outdoor }}°F. Is taking {{ obs_rate }} minutes
              per 1°F drop physically plausible and valid? Rules: - Normal cooling
              takes between 10.0 and 45.0 minutes per degree. Cool or mild outdoor
              conditions (50-70°F) result in fast, efficient cooling (10-30 min/deg).
              - Severe solar heat soak (>85°F outdoors) takes 45.0 to 90.0 minutes
              per degree. - Only flag ANOMALY if physically impossible: less than
              5.0 minutes per degree (sensor flash-freeze glitch) or greater than
              90.0 minutes per degree on mild days (equipment failure). Any session
              taking between 5.0 and 90.0 minutes per degree is physically VALID.
              Return your verdict starting strictly with ''VALID'' or ''ANOMALY''
              followed by a one-sentence explanation.'
          response_variable: audit_result
        - variables:
            audit_verdict: '{% set resp = audit_result.response.speech.plain.speech
              | default('''', true) if audit_result is defined and audit_result.response
              is defined and audit_result.response.speech is defined and audit_result.response.speech.plain
              is defined else '''' %} {{ resp | trim if resp | length > 0 else ''VALID:
              No AI response'' }}'
            new_repo_data: "{# 1. LOAD & LOOKUP (Type-Resilient) #} {%- set lkey =
              lookup_key | string | trim -%} {%- set raw = states('input_text.mbr_cooling_performance_data')
              | from_json -%} {%- set ns = namespace(orate=obs_rate, match=false)
              -%} {%- for k, v in raw.items() -%}\n  {%- if k|string|trim == lkey
              -%}\n    {%- set ns.orate = v | float -%}\n    {%- set ns.match = true
              -%}\n  {%- endif -%}\n{%- endfor -%} {# 2. MATH (Data Armor v2) #} {%-
              set diff = (ns.orate - obs_rate) | abs -%} {%- set alpha = 0.9 if diff
              < 3.0 else 0.7 -%} {%- set rwt = ((ns.orate * alpha) + (obs_rate * (1.0
              - alpha))) | round(1) -%} {%- set clp = [[rwt, 10.0]|max, 90.0]|min
              -%} {%- set df = clp - ns.orate -%} {%- set cap = 5.0 -%} {%- if df
              > cap -%}\n  {%- set nr = (ns.orate + cap) | round(1) -%}\n{%- elif
              df < (cap * -1) -%}\n  {%- set nr = (ns.orate - cap) | round(1) -%}\n{%-
              else -%}\n  {%- set nr = clp -%}\n{%- endif -%} {# 3. CLEAN-SWEEP MERGE
              #} {%- set ns_merge = namespace(items=[]) -%} {%- for k, v in raw.items()
              -%}\n  {%- if k|string|trim != lkey -%}\n    {%- set ns_merge.items
              = ns_merge.items + [(k|string|trim, v|float)] -%}\n  {%- endif -%}\n{%-
              endfor -%} {%- set ns_merge.items = ns_merge.items + [(lkey, nr|float)]
              -%} {# 4. EXPORT #} {{- {\n  \"new_repo\": dict(ns_merge.items | sort)
              | to_json,\n  \"old_rate\": ns.orate,\n  \"new_rate\": nr,\n  \"match\":
              ns.match\n} | to_json -}}"
        - variables:
            res: '{{ new_repo_data | from_json }}'
            new_repo: '{{ res.new_repo }}'
            old_rate: '{{ res.old_rate }}'
            new_rate: '{{ res.new_rate }}'
        - if:
          - condition: template
            value_template: '{{ (''VALID'' in audit_verdict | upper) or (obs_rate
              >= 10.0 and obs_rate <= 45.0) or (avg_outdoor >= 85.0 and obs_rate <=
              90.0) }}'
          then:
          - action: input_text.set_value
            target:
              entity_id: input_text.mbr_cooling_performance_data
            data:
              value: '{{ new_repo }}'
          - action: notify.send_message
            target:
              entity_id: '{{ log_entity }}'
            data:
              message: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }},PHASE_3_LEARNED,ObsRate:
                {{ obs_rate }},NewRate: {{ new_rate }},Bin: {{ lookup_key }},Audit:
                {{ audit_verdict | trim }}'
          else:
          - action: notify.mobile_app_josh_mobile
            data:
              title: '⚠️ Climate: Data Anomaly Detected'
              message: 'AI Analysis: {{ audit_verdict }} Observed: {{ obs_rate }}
                min/deg. Repository update skipped.

                '
          - action: notify.send_message
            target:
              entity_id: '{{ log_entity }}'
            data:
              message: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }},PHASE_3_ANOMALY,ObsRate:
                {{ obs_rate }},Audit: {{ audit_verdict | trim }}'
    - alias: 'Phase 4: Sleep Window (Keep Cool)'
      conditions:
      - condition: template
        value_template: '{{ is_sleep_window and actual >= (target + 1.0) and t6_target
          != (target - 2.0) }}'
      sequence:
      - action: notify.send_message
        target:
          entity_id: '{{ log_entity }}'
        data:
          message: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }},PHASE_4_KEEP_COOL,Indoor:
            {{ actual }},Pushing back to {{ target - 2.0 }}F'
      - action: climate.set_temperature
        target:
          entity_id: climate.t6_pro_downstairs
        data:
          temperature: '{{ target - 2.0 }}'
    - alias: 'Phase 5: Sleep Window (Prevent Over-Cooling)'
      conditions:
      - condition: template
        value_template: '{{ is_sleep_window and actual <= (target - 1.0) and t6_target
          != (target + 2.0) }}'
      sequence:
      - action: notify.send_message
        target:
          entity_id: '{{ log_entity }}'
        data:
          message: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }},PHASE_5_PREVENT_OVERCOOL,Indoor:
            {{ actual }},Letting room warm to {{ target + 2.0 }}F'
      - action: climate.set_temperature
        target:
          entity_id: climate.t6_pro_downstairs
        data:
          temperature: '{{ target + 2.0 }}'
  mode: queued
  max: 10
- id: '1778077597598'
  alias: Motion Babe Cave
  description: ''
  triggers:
  - alias: motion
