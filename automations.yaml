- id: outdoor_motion_lighting_engine
  alias: 'Lighting: Outdoor Motion Presence'
  description: Scalable engine for outdoor lights based on AI/Motion detection.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.front_porch_ptz_person_detected
    - binary_sensor.patio_left_person_detected
    - binary_sensor.driveway_outside_person_detected
    - binary_sensor.driveway_ptz_person_detected
    - binary_sensor.patio_right_person_detected
    to:
    - 'on'
  conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - condition: state
    entity_id: input_boolean.motion_lockout
    state: 'off'
  actions:
  - variables:
      target_switch: '{{ light_map[trigger.entity_id].switch }}'
  - action: switch.turn_on
    target:
      entity_id: '{{ target_switch }}'
  - wait_for_trigger:
    - trigger: template
      value_template: >-
        {%- set sensors = light_map[trigger.entity_id].motion_clear -%}
        {{- sensors | select('is_state', 'on') | list | length == 0 -}}
      for:
        minutes: 2
    timeout: 01:00:00
  - if:
    - condition: template
      value_template: >-
        {%- set sensors = light_map[trigger.entity_id].motion_clear -%}
        {{- sensors | select('is_state', 'on') | list | length == 0 -}}
    then:
    - action: switch.turn_off
      target:
        entity_id: '{{ target_switch }}'
  variables:
    light_map:
      binary_sensor.front_porch_ptz_person_detected:
        switch: switch.front_yard_lights
        motion_clear:
        - binary_sensor.front_porch_ptz_person_detected
      binary_sensor.patio_left_person_detected:
        switch: switch.backyard_lights
        motion_clear:
        - binary_sensor.patio_left_person_detected
        - binary_sensor.patio_right_person_detected
      binary_sensor.patio_right_person_detected:
        switch: switch.backyard_lights
        motion_clear:
        - binary_sensor.patio_left_person_detected
        - binary_sensor.patio_right_person_detected
      binary_sensor.driveway_outside_person_detected:
        switch: switch.garage_spot_light
        motion_clear:
        - binary_sensor.driveway_outside_person_detected
        - binary_sensor.driveway_ptz_person_detected
      binary_sensor.driveway_ptz_person_detected:
        switch:
        - switch.garage_spot_light
        - switch.front_yard_lights
        motion_clear:
        - binary_sensor.driveway_outside_person_detected
        - binary_sensor.driveway_ptz_person_detected
        - binary_sensor.front_porch_ptz_person_detected
  mode: parallel
  max: 10
- id: '1772728212323'
  alias: 'Security: Front Porch - AI Video Analysis (v1.6)'
  description: 'v1.6: Sequential processing with 3-minute visitor event cooldown against
    notify.daily_camera_log to prevent duplicate arrival/departure reporting.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.front_porch_ptz_person_detected
    to: 'on'
  - trigger: state
    entity_id: input_button.test_porch_ai
  conditions:
  - condition: state
    entity_id: input_boolean.camera_alerts
    state: 'on'
  - condition: template
    value_template: >-
      {{ (trigger is defined and trigger.entity_id == 'input_button.test_porch_ai') or
         (as_timestamp(now()) - as_timestamp(states('notify.daily_camera_log'), 0) > 180) }}
  - condition: template
    value_template: '{# Increase cooldown to 10 minutes (600s) to save quota #} {{
      this.attributes.last_triggered == None or (now() - this.attributes.last_triggered).total_seconds()
      > 600 }}

      '
    enabled: false
  actions:
  - alias: 'Data Collection: Video and Snapshots'
    continue_on_error: true
    parallel:
    - action: camera.record
      continue_on_error: true
      target:
        entity_id: camera.front_ptz_medium_resolution_channel
      data:
        duration: 12
        lookback: 3
        filename: /media/snapshots/porch/approach.mp4
    - sequence:
      - delay:
          seconds: 1
      - action: camera.snapshot
        target:
          entity_id: camera.doorbell_outside_medium_resolution_channel
        data:
          filename: /media/snapshots/porch/doorbell_t0.jpg
      - delay:
          seconds: 2
      - action: camera.snapshot
        target:
          entity_id: camera.doorbell_outside_medium_resolution_channel
        data:
          filename: /media/snapshots/porch/doorbell_t1.jpg
      - delay:
          hours: 0
          minutes: 0
          seconds: 3
          milliseconds: 0
      - action: camera.snapshot
        target:
          entity_id: camera.doorbell_outside_medium_resolution_channel
        data:
          filename: /media/snapshots/porch/doorbell_t3.jpg
  - alias: Flush Delay
    delay:
      seconds: 2
  - alias: Sample Approach Video
    action: shell_command.sample_approach_video
    continue_on_error: true
  - alias: AI Porch Video Analysis
    action: extended_openai_conversation.query_image
    data:
      config_entry: 01M3YG3WVESNZR8QG41VKNSXHE
      model: qwen-vl-7b
      prompt: >-
        You are analyzing a security event from a front porch camera.
        - Item 1 is a reference photo of resident Josh (identification profile only).
        - Item 2 is a reference photo of resident MJ (identification profile only).
        - Item 3 is a video recording of the entire front porch approach.

        Do NOT describe Item 1 or Item 2. Focus strictly on the video (Item 3).

        Rules:
        1. Examine Item 3: If NO person and NO delivery vehicle is visible in the video:
           Output: [ALL_CLEAR] No activity on porch.

        2. If a person or vehicle IS in the video:
           - Check if they are delivering a package, wearing a delivery uniform (Amazon, UPS, FedEx, USPS), or driving a delivery truck:
             Output: [ALERT] Person: [delivery driver/uniform/company]. Action: [delivery action]. Intent: Delivery.
           - If NOT delivering, compare them to resident reference photos (Item 1 = Josh, Item 2 = MJ). If they match a resident:
             Output: [RESIDENT] Person: Josh (or MJ). Action: [action]. Intent: Resident.
           - If they entered the front door or were let inside:
             Output: [ENTERED] Person: [visitor description]. Action: Entered home. Intent: Visitor.
           - If they are an unfamiliar visitor, solicitor, or unrecognized person:
             Output: [ALERT] Person: [visitor description]. Action: [action]. Intent: Visitor.

        Output must be a SINGLE line without markdown or newlines.
      images:
        - url: /media/snapshots/reference/josh_thumb.jpg
        - url: /media/snapshots/reference/mj_thumb.jpg
        - url: /media/snapshots/porch/approach_sample.mp4
      max_tokens: 150
    response_variable: porch_report
    continue_on_error: true
  - variables:
      report: >-
        {{ porch_report.choices[0].message.content | default('[ALL_CLEAR] No person on porch.', true)
           if porch_report is defined and porch_report.choices is defined and porch_report.choices | length > 0
           else '[ALL_CLEAR] No person on porch.' }}
  - if:
      - condition: template
        value_template: "{{ '[ALL_CLEAR]' not in report }}"
    then:
      - action: notify.send_message
        target:
          entity_id: notify.daily_camera_log
        data:
          message: "{{ now().strftime('%I:%M %p') }} - Front Porch: {{ report }}"
      - action: notify.send_message
        target:
          entity_id:
            - notify.porch_history
        data:
          message: >-
            {% set tag = report.split(']')[0] ~ ']' if ']' in report else '[ERROR]' %}
            {% set content = report.replace(tag, '').strip() %}
            "{{ now().strftime('%Y-%m-%d') }}","{{ now().strftime('%H:%M:%S') }}","{{ tag }}","{{ content | replace('"', '""') }}"
      - if:
          - condition: template
            value_template: "{{ '[ALERT]' in report }}"
        then:
          - action: notify.persistent_notification
            data:
              title: Porch Intel (Full Report)
              message: >-
                {% set tag = report.split(']')[0] ~ ']' if ']' in report else '[ALERT]' %}
                {{ report.replace(tag, '').strip() }}
          - action: notify.mobile_app_josh_mobile
            data:
              title: Porch Intel
              message: >-
                {% set tag = report.split(']')[0] ~ ']' if ']' in report else '[ALERT]' %}
                {{ report.replace(tag, '').strip() | truncate(150, true, '...') }}
          - if:
              - condition: state
                entity_id: alarm_control_panel.home_alarm
                state:
                  - armed_away
                  - armed_vacation
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.porch_visitor_while_away
  mode: single
- id: '1772742848092'
  alias: System - Cameras - Evening AI Rollup
  description: Reads daily porch events and generates an evening HTML security briefing via Local Brain (Qwen 32B).
  triggers:
  - at: '20:00:00'
    trigger: time
  actions:
  - action: shell_command.read_daily_camera_log
    response_variable: daily_log
  - variables:
      raw_log: "{{ (daily_log.stdout | default('', true)).strip() if daily_log is defined and daily_log.stdout is defined else '' }}"
  - if:
      - condition: template
        value_template: "{{ raw_log | length > 0 }}"
    then:
      - action: conversation.process
        continue_on_error: true
        data:
          agent_id: conversation.extended_openai_conversation_2
          text: >-
            Today is {{ now().strftime('%A, %B %d, %Y') }}.
            Read the following log of today's camera events:
            <camera_log>
            {{ raw_log }}
            </camera_log>

            Write a cohesive evening security briefing summarizing the activity. Group similar events together (e.g. package deliveries, visitors, solicitors, unusual activity).
            Consolidate multiple events occurring within a few minutes of each other for the same visitor or delivery into a single entry (arrival and departure are part of the same visit; do not create duplicate bullet points for the same person arriving and leaving).
            Format your entire response using clean HTML (use <h3> for headers, <ul> and <li> for bullet points, and <b> for bold text).
            Do not wrap your response in markdown code blocks. Return ONLY raw HTML.
        response_variable: evening_rollup
  - action: smtp.send_message
    target:
      entity_id: notify.email_daily_rollup_flamingotter_hass_gmail_com
    data:
      title: Security Briefing - {{ now().strftime('%b %d, %Y') }}
      message: Please view this email in an HTML-compatible client.
      html: >-
        {% if raw_log | length == 0 %}
          <h3>All clear. No porch activity detected today.</h3>
        {% else %}
          {% set resp = evening_rollup.response.speech.plain.speech | default('', true) if evening_rollup is defined and evening_rollup.response is defined and evening_rollup.response.speech is defined and evening_rollup.response.speech.plain is defined else '' %}
          {% if resp | length > 0 %}
            {{ resp | replace('```html', '') | replace('```', '') | trim }}
          {% else %}
            <h3>The daily security briefing could not be generated at this time.</h3>
          {% endif %}
        {% endif %}
