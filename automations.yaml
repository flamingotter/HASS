    timeout: 01:00:00
  - if:
    - condition: template
      value_template: '{%- set sensors = light_map[trigger.entity_id].motion_clear
        -%} {{- sensors | select(''is_state'', ''on'') | list | length == 0 -}}'
    then:
    - action: switch.turn_off
