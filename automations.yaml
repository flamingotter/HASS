- id: appliance_alert_engine
  alias: 'System: Appliance Alert Engine'
  description: Unified engine for monitoring appliance power consumption and performance.
  variables:
    appliance_map:
      sensor.garage_beer_fridge_electric_consumption_w:
        name: Beer Fridge
        switch: switch.garage_beer_fridge
        tag: beer01-notify
        off_action: beer01-off
      sensor.garage_freezer_electric_consumption_w:
        name: Freezer
        switch: switch.garage_freezer
        tag: frzr01-notify
        off_action: frzr01-off
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.garage_beer_fridge_electric_consumption_w
    - sensor.garage_freezer_electric_consumption_w
    for:
      minutes: 90
    below: 1
    id: unplugged
  - trigger: numeric_state
    entity_id:
    - sensor.garage_beer_fridge_electric_consumption_w
    - sensor.garage_freezer_electric_consumption_w
    for:
      hours: 3
    below: 10
    id: stalled
  - trigger: numeric_state
    entity_id:
    - sensor.garage_beer_fridge_electric_consumption_w
    - sensor.garage_freezer_electric_consumption_w
    for:
      hours: 2
      minutes: 30
    above: 10
    id: overrunning
  - trigger: event
    event_type: mobile_app_notification_action
    id: remote_off
  actions:
  - variables:
      appliance_sensor: "{% if trigger.id == 'remote_off' %}\n  {% if trigger.event.data.action
        == 'beer01-off' %} sensor.garage_beer_fridge_electric_consumption_w\n  {%
        elif trigger.event.data.action == 'frzr01-off' %} sensor.garage_freezer_electric_consumption_w\n
        \ {% endif %}\n{% else %}\n  {{ trigger.entity_id | default('') }}\n{% endif
        %}\n"
      config: '{{ appliance_map.get(appliance_sensor.strip(), {}) }}'
  - condition: template
    value_template: '{{ config.name is defined }}'
  - choose:
    - conditions:
      - condition: trigger
        id: unplugged
      sequence:
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.mobile_app_josh_mobile
          title: '{{ config.name | upper }} CRITICAL ALERT'
          message: '{{ config.name }} power is 0W / unplugged for 90 mins!'
          notify_tag: '{{ config.tag }}'
    - conditions:
      - condition: trigger
        id: stalled
      sequence:
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.mobile_app_josh_mobile
          title: '{{ config.name | upper }} ALERT'
          message: '{{ config.name }} hasn''t run in 3 hours!'
          notify_tag: '{{ config.tag }}'
    - conditions:
      - condition: trigger
        id: overrunning
      sequence:
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.mobile_app_josh_mobile
          title: '{{ config.name | upper }} ALERT'
          message: '{{ config.name }} has been running for > 2.5hrs!'
          notify_tag: '{{ config.tag }}'
          notify_action_1: '{{ config.off_action }}'
          notify_action_1_title: Turn Off
    - conditions:
      - condition: trigger
        id: remote_off
      - condition: template
        value_template: '{{ config.off_action is defined }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: '{{ config.switch }}'
      - action: notify.mobile_app_josh_mobile
        data:
          message: clear_notification
          data:
            tag: '{{ config.tag }}'
  mode: parallel
  max: 10
- id: '1752157984119'
  alias: Notify Shuttle Bay
  description: ''
  triggers:
  - alias: shuttle_bay Open
    entity_id:
    - cover.shuttle_bay
    id: shuttle-bay
    trigger: state
    to: open
  - alias: timer_finished
    event_type: timer.finished
    event_data:
      entity_id: timer.timer_garage_door
    id: timer_finished
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: close_garage_01
    id: close_garage_01
    alias: close_garage_01
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: ignore_garage_01
    id: ignore_garage_01
    alias: ignore_garage_01
    trigger: event
  - alias: cleared
    event_type: mobile_app_notification_cleared
    id: cleared
    event_data:
      tag: garage-warning_01
    trigger: event
  - alias: shuttle_bay Closed
    entity_id:
    - cover.shuttle_bay
    id: shuttle-bay-closed
    trigger: state
    to: closed
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: shuttle-bay
      sequence:
      - action: timer.start
        data:
          duration: 00:05:00
        target:
          entity_id: timer.timer_garage_door
      alias: shuttle_bay_open
    - conditions:
      - condition: trigger
        id: shuttle-bay-closed
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.timer_garage_door
      - action: notify.all_devices
        data:
          message: clear_notification
          data:
            tag: garage-warning_01
      alias: shuttle_bay_closed
    - conditions:
      - condition: trigger
        id: timer_finished
      - condition: state
        entity_id: cover.shuttle_bay
        state: open
      sequence:
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.mobile_app_josh_mobile
          title: Garage Door
          message: Garage Door 01 Open
          notify_tag: garage-warning_01
          notify_action_1: close_garage_01
          notify_action_1_title: Close
          notify_action_2: ignore_garage_01
          notify_action_2_title: Ignore
      alias: timer_finished
    - conditions:
      - condition: trigger
        id: close_garage_01
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.shuttle_bay
        data: {}
      - action: notify.all_devices
        data:
          message: clear_notification
          data:
            tag: garage-warning_01
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.all_devices
          title: Garage Door
          message: Garage Door 01 Closing
          notify_tag: garage-status
      alias: close_garage_01
    - conditions:
      - condition: trigger
        id: ignore_garage_01
      sequence:
      - action: timer.start
        data:
          duration: 01:00:00
        target:
          entity_id: timer.timer_garage_door
      - action: notify.all_devices
        data:
          message: clear_notification
          data:
            tag: garage-warning_01
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.all_devices
          title: Garage Door
          message: Garage Door 01 Ignored. Reminding in 1 hour
          notify_tag: garage-status
      alias: ignore_garage_01
    - conditions:
      - condition: trigger
        id: cleared
      - condition: state
        entity_id: cover.shuttle_bay
        state: open
      sequence:
      - variables:
          device_id: '{{ trigger.event.data.device_id }}'
          cleared: true
      - action: system_log.write
        data:
          level: warning
          message: Garage Door 01 notification cleared on device {{ device_id }} while
            door is open
