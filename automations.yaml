            Cat (he/him, the grumpy feline commander) demanding immediate dinner tribute
            from the kitchen minions.',\n  'Josie (she/her, aristocratic feline princess)
            politely but firmly decreeing that dinner is overdue.',\n  'Custard (she/her,
            dramatic queen) staging a tragic protest claiming she has never once eaten
            in her entire life.',\n  'Mars (he/him, goofy energetic dog) doing tippy-taps
            and vibrating with puppy hype for kibble.',\n  'A top-secret spy briefing
            codenamed Operation Dinner Bowl for agents Battle Cat, Josie, Custard,
            and Mars.',\n  'A dramatic breaking news bulletin warning of catastrophic
            5 PM food bowl depletion in the kitchen.',\n  'An exasperated pet union
            representative filing an official grievance over delayed 5 PM rations.',\n
            \ 'An enthusiastic sports announcer doing high-energy play-by-play on
            the pets surrounding their dinner bowls.',\n  'A snooty five-star Michelin
            food critic demanding the evening service commence immediately for the
            quartet.'\n] -%} Today is {{ day }} at 5:00 PM. Write a unique, hilarious,
            creative 1-2 sentence pet dinner announcement for the household pets:
            Battle Cat (he/him), Josie (she/her), Custard (she/her), and Mars (he/him,
            the dog). Perspective/Style: {{ styles | random }} Rules: Write 1-2 complete
            natural spoken sentences with proper punctuation. Limit to 25 words total.
            No quotation marks. Never repeat generic phrases like \"ensure fresh water\"."
        response_variable: gen_text
      - delay:
          hours: 0
          minutes: 0
          seconds: 2
          milliseconds: 0
      - action: notify.alexa_media
        continue_on_error: true
        metadata: {}
        data:
          message: '{% set resp = gen_text.response.speech.plain.speech | default('''',
            true) if gen_text is defined and gen_text.response is defined and gen_text.response.speech
            is defined and gen_text.response.speech.plain is defined else '''' %}
            {{ resp | trim | replace(''\"'', '''') if resp | length > 0 else ''It
            is time to feed the cats and Mars.'' }}'
          target: media_player.counter
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.all_devices
          title: Feeding Mission
          message: '{% set resp = gen_text.response.speech.plain.speech | default('''',
            true) if gen_text is defined and gen_text.response is defined and gen_text.response.speech
            is defined and gen_text.response.speech.plain is defined else '''' %}
            {{ resp | trim | replace(''\"'', '''') if resp | length > 0 else ''It
            is time to feed the cats and Mars.'' }}'
          notify_tag: pets-notify
          notify_action_1: feed_done
          notify_action_1_title: Done
          notify_action_2: feed_passon
          notify_action_2_title: Ask Other
      - action: scene.turn_on
        continue_on_error: true
        metadata: {}
        target:
          entity_id: scene.last_alexa_volume
        data: {}
      - action: switch.turn_on
        metadata: {}
        target:
          entity_id: switch.guest_hall_light
        data: {}
    - conditions:
      - condition: trigger
        id: feed_done
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.feed_pets_reminder
      - variables:
          scanned_device: '{{ trigger.device_id | default(trigger.event.data.device_id)
            | default(''unknown'') }}'
          scanned_name: '{{ ''Josh'' if scanned_device == josh_device_id else ''MJ''
            }}'
          target_notify: '{{ ''mobile_app_mj_pixel_8_pro'' if scanned_name == ''Josh''
            else ''mobile_app_josh_mobile'' }}'
      - action: notify.all_devices
        data:
          message: clear_notification
          data:
            tag: pets-notify
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: '{{ "notify." ~ target_notify }}'
          title: Mission Accomplished
          message: '{{ scanned_name }} has fed the cats and Mars.'
          notify_tag: pets-status
    - conditions:
      - condition: trigger
        id: feed_passon
      sequence:
      - variables:
          scanned_device: '{{ trigger.device_id | default(trigger.event.data.device_id)
            | default(''unknown'') }}'
          scanned_name: '{{ ''Josh'' if scanned_device == josh_device_id else ''MJ''
            }}'
          target_notify: '{{ ''mobile_app_mj_pixel_8_pro'' if scanned_name == ''Josh''
            else ''mobile_app_josh_mobile'' }}'
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: '{{ "notify." ~ target_notify }}'
          title: Reinforcements Requested
          message: Help! Mars and the felines are teaming up. Can you take this one?
          notify_tag: pets-notify
          notify_action_1: feed_done
          notify_action_1_title: Done
    - conditions:
      - condition: trigger
        id: feed_cleared
      - condition: state
        entity_id: input_boolean.feed_pets_reminder
        state: 'on'
      - condition: template
        value_template: '{{ trigger.event.event_type == ''mobile_app_notification_cleared''
          }}'
      sequence:
      - action: conversation.process
        continue_on_error: true
        data:
          agent_id: conversation.extended_openai_conversation_2
          text: "{%- set nag_styles = [\n  'Battle Cat recording this unauthorized
            notification swipe on your permanent human record.',\n  'Mars looking
            utterly heartbroken with giant puppy dog eyes that a swipe replaced his
            dinner.',\n  'Custard dramatically declaring this dismissed reminder an
            international feline emergency.',\n  'Josie expressing refined, high-society
            aristocratic disgust at being dismissed.',\n  'The four pets organizing
            an immediate kitchen sit-in protest until bowls are filled.'\n] -%} The
            user swiped away the 5 PM pet feeding reminder without feeding the pets.
            Write a witty, firm 1-sentence nag from the perspective of: {{ nag_styles
            | random }} Pets: Battle Cat (he/him), Josie (she/her), Custard (she/her),
            and Mars (he/him). Rules: Write 1 complete natural spoken sentence with
            proper punctuation. Limit to 20 words total. No quotation marks."
        response_variable: nag_text
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.mobile_app_josh_mobile
          title: Feeding Required
          message: '{% set resp = nag_text.response.speech.plain.speech | default('''',
            true) if nag_text is defined and nag_text.response is defined and nag_text.response.speech
            is defined and nag_text.response.speech.plain is defined else '''' %}
            {{ resp | trim | replace(''\"'', '''') if resp | length > 0 else "The
            felines and Mars are still hungry! Please feed them." }}'
          notify_tag: pets-notify
          sticky: true
          notify_action_1: feed_done
          notify_action_1_title: Done
          notify_action_2: feed_passon
          notify_action_2_title: Ask Other
  mode: restart
  variables:
    josh_device_id: d818035824cf47ea
    mj_device_id: 0aa560faf0e8784c
- id: '1724794143393'
  alias: 'Climate: Enhanced Eco Mode Manager (v2.0)'
  description: Handles Eco Mode timers, extensions via AI parsing, and proximity-based
    deactivation.
  triggers:
  - event_type: timer.finished
    event_data:
      entity_id: timer.timer_eco_mode_normal
    id: timer_done
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      tag: eco-finish
      action: REPLY
    id: extend_eco
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      tag: eco-finish
      action: eco_normal
    id: deactivate_eco
    trigger: event
  - event_type: mobile_app_notification_cleared
    event_data:
      tag: eco-finish
    id: notification_cleared
    trigger: event
  - entity_id:
    - sensor.home_josh_distance
    - sensor.home_mj_distance
    below: 264000
    id: proximity_reset
    trigger: numeric_state
  - entity_id: input_boolean.eco_mode
    to: 'on'
    id: eco_activated
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: eco_activated
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.t6_pro_downstairs
        data:
          temperature: '{% if is_state(''climate.t6_pro_downstairs'', ''cool'') %}
            74 {% elif is_state(''climate.t6_pro_downstairs'', ''heat'') %} 66 {%
            else %} 70 {% endif %}

            '
      - action: climate.set_temperature
        target:
          entity_id: climate.t6_pro_upstairs
        data:
          temperature: '{% if is_state(''climate.t6_pro_upstairs'', ''cool'') %} 78
            {% elif is_state(''climate.t6_pro_upstairs'', ''heat'') %} 64 {% else
            %} 73 {% endif %}

            '
      - action: notify.mobile_app_josh_mobile
        data:
          title: Eco Mode Activated
          message: 'Home is in Vacation mode. T6 Pro set to {{ state_attr(''climate.t6_pro_downstairs'',
            ''temperature'') }}°F.  How many days should I set the timer for? (e.g.
            ''3'' or ''until Sunday'')

            '
          data:
            tag: eco-finish
            persistent: true
            actions:
            - action: REPLY
              title: Set Timer
            - action: eco_normal
              title: Return to Normal
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: timer_done
        - and:
          - condition: trigger
            id: notification_cleared
          - condition: state
            entity_id: timer.timer_eco_mode_normal
            state: idle
      - condition: state
        entity_id: input_boolean.eco_mode
        state: 'on'
      sequence:
      - action: notify.mobile_app_josh_mobile
        data:
          title: Eco Mode Status
          message: Eco Mode timer has finished. Would you like to return to normal
            or extend?
          data:
            tag: eco-finish
            persistent: true
            actions:
            - action: eco_normal
              title: Return to Normal
            - action: REPLY
              title: Add Days (e.g. '3' or 'until Sunday')
    - conditions:
      - condition: trigger
        id: extend_eco
      sequence:
      - action: conversation.process
        continue_on_error: true
        data:
          agent_id: conversation.extended_openai_conversation_2
          text: 'Today is {{ now().strftime(''%A'') }}. The user wants to extend an
            HVAC timer. Their reply was: "{{ trigger.event.data.reply_text }}". Convert
            this into a number of DAYS from now. If they just gave a number, return
            that number. If they gave a day of the week, calculate days until that
            day. Return ONLY the integer number of days as a single number with no
            other text, words, or punctuation.'
        response_variable: extension_days
      - variables:
          raw_days: '{% set resp = extension_days.response.speech.plain.speech | default('''',
            true) if extension_days is defined and extension_days.response is defined
            and extension_days.response.speech is defined and extension_days.response.speech.plain
            is defined else '''' %} {{ resp | trim }}'
          days: '{{ (raw_days | int(1)) if (raw_days | is_number) else 1 }}'
          seconds: '{{ ((raw_days | int(1)) if (raw_days | is_number) else 1) * 86400
            }}'
      - action: timer.start
        data:
          duration: '{{ seconds }}'
        target:
          entity_id: timer.timer_eco_mode_normal
      - action: notify.mobile_app_josh_mobile
        data:
          title: Eco Mode Extended
          message: 'AI Parser: ''{{ trigger.event.data.reply_text }}'' interpreted
            as {{ days }} days. Eco Mode will remain active.'
          data:
            tag: eco-status
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: deactivate_eco
        - and:
          - condition: trigger
            id: proximity_reset
          - condition: state
            entity_id: input_boolean.eco_mode
            state: 'on'
          - condition: numeric_state
            entity_id: sensor.home_josh_distance
            below: 264000
          - condition: numeric_state
            entity_id: sensor.home_mj_distance
            below: 264000
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.eco_mode
      - action: timer.cancel
        target:
          entity_id: timer.timer_eco_mode_normal
      - action: notify.mobile_app_josh_mobile
        data:
          message: clear_notification
          data:
            tag: eco-finish
      - action: climate.set_temperature
        target:
          entity_id: climate.t6_pro_downstairs
        data:
          temperature: "{%- if is_state('climate.t6_pro_downstairs', 'heat') -%}\n
            \ 68\n{%- else -%}\n  70\n{%- endif -%}"
      - action: climate.set_temperature
        target:
          entity_id: climate.t6_pro_upstairs
        data:
          temperature: "{%- if is_state('climate.t6_pro_upstairs', 'heat') -%}\n  67\n{%-
            else -%}\n  73\n{%- endif -%}"
      - action: notify.mobile_app_josh_mobile
        data:
          title: Welcome Home
          message: 'Eco Mode deactivated ({{ ''Manual'' if trigger.id == ''deactivate_eco''
            else ''Proximity'' }}). Downstairs: {{ ''68°F (Heat)'' if is_state(''climate.t6_pro_downstairs'',
            ''heat'') else ''70°F (Cool)'' }} | Upstairs: {{ ''67°F (Heat)'' if is_state(''climate.t6_pro_upstairs'',
            ''heat'') else ''73°F (Cool)'' }}.'
          data:
            tag: eco-status
  mode: restart
- id: '1725030108440'
  alias: Cleaning Lifecycle
  description: Manages lights, timers, and AI notifications for cleaning mode.
  triggers:
  - entity_id: input_boolean.cleaning
    to: 'on'
    id: start
    trigger: state
  - entity_id: input_boolean.cleaning
    to: 'off'
    id: stop
    trigger: state
  - event_type: timer.finished
    event_data:
      entity_id: timer.timer_cleaning
    id: remind
    trigger: event
  - event_type: mobile_app_notification_cleared
    event_data:
      tag: cleaning-warning
    id: remind
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: cleaning_off
    id: stop
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: cleaning_snooze
    id: snooze
    trigger: event
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - parallel:
        - action: scene.create
          data:
            scene_id: cleaning_before
            snapshot_entities: '{{ label_entities(''cleaning_light'') }}'
        - action: homeassistant.turn_on
          target:
            label_id: cleaning_light
          data:
            brightness_pct: 100
            kelvin: 4500
      - action: timer.start
        data:
          duration: 01:00:00
        target:
          entity_id: timer.timer_cleaning
    - conditions:
      - condition: trigger
        id: stop
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.cleaning
      - action: timer.cancel
        target:
          entity_id: timer.timer_cleaning
      - action: notify.all_devices
        data:
          message: clear_notification
          data:
            tag: cleaning-warning
      - action: scene.turn_on
        target:
          entity_id: scene.cleaning_before
      - action: conversation.process
        continue_on_error: true
        data:
          agent_id: conversation.extended_openai_conversation_2
          text: The user just finished cleaning. Write a high-energy, hilarious, and
            extremely enthusiastic congratulatory message. Use some 'Army-style' colorful
            language. Limit to 25 words, no quotes.
        response_variable: clean_complete_ai
      - action: notify.alexa_media
        data:
          message: '{% set resp = clean_complete_ai.response.speech.plain.speech |
            default('''', true) if clean_complete_ai is defined and clean_complete_ai.response
            is defined and clean_complete_ai.response.speech is defined and clean_complete_ai.response.speech.plain
            is defined else '''' %} {{ resp | trim | replace(''\"'', '''') if resp
            | length > 0 else ''Cleaning mission complete! Outstanding work!'' }}'
          target: '{{ states.sensor.last_alexa.state }}'
    - conditions:
      - condition: trigger
        id: remind
      - condition: state
        entity_id: input_boolean.cleaning
        state: 'on'
      sequence:
      - action: conversation.process
        continue_on_error: true
        data:
          agent_id: conversation.extended_openai_conversation_2
          text: The house is still in 'Cleaning Mode'. Write a short, slightly annoying
            but helpful reminder asking if they are done. Limit to 20 words, no quotes.
        response_variable: cleaning_nag
      - action: script.activate_mobile_actionable_notification
        data:
          notify_target: notify.all_devices
          title: Cleaning Mode
          message: '{% set resp = cleaning_nag.response.speech.plain.speech | default('''',
            true) if cleaning_nag is defined and cleaning_nag.response is defined
            and cleaning_nag.response.speech is defined and cleaning_nag.response.speech.plain
            is defined else '''' %} {{ resp | trim | replace(''\"'', '''') if resp
            | length > 0 else "The house is still in Cleaning Mode. Are you done?"
            }}'
          notify_tag: cleaning-warning
          notify_action_1: cleaning_off
          notify_action_1_title: Turn Off
          notify_action_2: cleaning_snooze
          notify_action_2_title: Snooze 30min
    - conditions:
      - condition: trigger
        id: snooze
      sequence:
      - action: timer.start
        data:
          duration: 00:30:00
        target:
          entity_id: timer.timer_cleaning
      - action: notify.all_devices
        data:
          message: clear_notification
          data:
            tag: cleaning-warning
  mode: restart
- id: '1725031300511'
  alias: Notify House Guests
  description: ''
  trigger:
  - alias: guests_arm
    platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: guests_arm
    id: guests_arm
  - alias: guests_ignore
    platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: guests_ignore
    id: guests_ignore
  - platform: event
    event_type: mobile_app_notification_cleared
    event_data:
      tag: arm-guests
    alias: cleared
    id: cleared
  condition: []
  action:
  - alias: guests_arm
