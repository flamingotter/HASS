      model: qwen-vl-7b
      prompt: 'You are an AI generating an audio announcement for a home doorbell
        speaker. In one short, natural spoken sentence (max 15 words), announce who
        is at the door and their action. Focus on intent: delivery driver, mail carrier,
        visitor, or solicitor. Do not include clothing details or weather unless relevant
        to their intent. Never use labels like ''Person:'' or ''Action:''.'
      images:
      - url: /media/snapshots/porch/doorbell_visitor.jpg
      max_tokens: 60
    response_variable: visitor_analysis
