---
binary_sensor:
  - name: "Dishwasher Running"
    unique_id: dishwasher_running_001
    device_class: running
    icon: mdi:dishwasher
    state: >-
      {{ is_state('sensor.dishwasher_operation_state', 'run') or states('sensor.panel_02_dishwasher_power') | float(0) > 10 }}
    delay_on:
      seconds: 30
    delay_off:
      minutes: 1
