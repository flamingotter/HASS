---
- sensor:
    name: "Log Error Count (48h)"
    unique_id: log_error_count
    command: >-
      LOG="/config/home-assistant.log"; if [ -f "$LOG" ]; then grep " ERROR " "$LOG" | awk -v d="$(date -d '48 hours ago' +'%Y-%m-%d %H:%M:%S')" '$1 " " $2 >= d' | grep -vc "frontend.js.modern" || echo 0; else echo 0; fi
    scan_interval: 300
    value_template: "{{ value | int(0) }}"
    unit_of_measurement: "errors"
- sensor:
    name: "Log Warning Count (48h)"
    unique_id: log_warning_count
    command: >-
      LOG="/config/home-assistant.log"; if [ -f "$LOG" ]; then grep " WARNING " "$LOG" | awk -v d="$(date -d '48 hours ago' +'%Y-%m-%d %H:%M:%S')" '$1 " " $2 >= d' | grep -vc "frontend.js.modern" || echo 0; else echo 0; fi
    scan_interval: 300
    value_template: "{{ value | int(0) }}"
    unit_of_measurement: "warnings"